openapi: "3.0.3"
info:
  title: "MkDocsEditor Backend API"
  version: "2.0.0"
  description: |
    REST API of the MkDocsEditor backend. It serves the section, document and resource tree
    of an MkDocs wiki and the websocket for realtime collaborative editing.

    The websocket protocol (Automerge sync, presence, close codes) is specified in
    [docs/sync-protocol.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/sync-protocol.md).

    All paths also work without the trailing slash. Ids of sections, documents and
    resources are derived from their path, so they change when an item (or a section
    above it) is renamed. The root section has the id `root`.

    Accounts, sessions and the login flows are specified in
    [docs/auth.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/auth.md).
    Requests authenticate with the session cookie (web), `Authorization: Bearer mds_…`
    (Android) or, during the transition, HTTP basic auth (`server.auth.legacyBasicAuth`).
    Every request with a method other than `GET`/`HEAD`/`OPTIONS` and without an
    `Authorization` header must send `X-Requested-With`, and an `Origin` header must be an
    allowed origin (CSRF protection). Users with the role `reader` get `403` when they try to
    change content. Error responses carry a machine-readable `code`.
  license:
    name: "AGPL-3.0-or-later"
    url: "https://www.gnu.org/licenses/agpl-3.0.html"
servers:
  - url: "http://localhost:7413"
security:
  - cookieAuth: []
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: Status
    description: "Health"
  - name: Auth
    description: "Login, links, websocket tickets and the Automerge actor map"
  - name: Account
    description: "The signed-in user's own account (sessions only)"
  - name: Admin
    description: "User administration (admin sessions only)"
  - name: MkDocs
    description: "The MkDocs project"
  - name: Sections
    description: "Folders of the docs tree"
  - name: Documents
    description: "Markdown files"
  - name: Resources
    description: "Other files (images, attachments)"
  - name: History
    description: "Revision history of documents from git (requires git.enabled)"

paths:
  /alive/:
    get:
      summary: "Liveness probe"
      operationId: alive
      tags: [ Status ]
      security: [ ]
      responses:
        "200":
          description: "The service is up."

  /auth/whoami/:
    get:
      summary: "The authenticated user"
      description: "With `server.auth.disabled`, this is the user `anonymous` with the role `admin`."
      operationId: whoAmI
      tags: [ Auth ]
      responses:
        "200":
          description: "The authenticated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/ws-ticket/:
    post:
      summary: "Issue a websocket ticket"
      description: |
        Returns a single-use ticket that is valid for 60 seconds. Browsers cannot set headers on
        a websocket, so they send the ticket in the `hello` message of the document websocket.
        Tickets are kept in memory only; a backend restart invalidates them.
      operationId: issueWsTicket
      tags: [ Auth ]
      responses:
        "200":
          description: "A new ticket"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/status/:
    get:
      summary: "Authentication status of the server"
      description: "What a client needs before the login: setup mode, passkeys, password rules."
      operationId: authStatus
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /server-info/:
    get:
      summary: "Describe the instance for onboarding screens"
      description: "Instance name, versions, URLs and login methods. Nothing secret and nothing about accounts. A superset of /auth/status/ for onboarding."
      operationId: serverInfo
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The server info"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /auth/device-link/redeem/:
    post:
      summary: "Exchange a device link token for a session"
      description: |
        Pairs a new device (the Android app) with the account that created the device link.
        The second factor counts as satisfied. The new session is not recently
        authenticated, except that it may add a passkey during its first 10 minutes.
        Unknown, used, expired and revoked tokens and a wrong username give `invalid-link`.
        Rate limited per IP.
      operationId: redeemDeviceLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLinkRedeemRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login/:
    post:
      summary: "Log in with username and password"
      description: |
        Returns a session, or a challenge when the account has a second factor. Wrong
        usernames and passwords give the same `invalid-credentials` error. Rate limited per
        IP and per account.
      operationId: login
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "A session (`status: ok`) or a second factor challenge (`status: second-factor-required`)"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/SecondFactorRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login/second-factor/:
    post:
      summary: "Complete a login with a TOTP code or a recovery code"
      operationId: loginSecondFactor
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`invalid-second-factor` (`details.attemptsLeft`) or `challenge-expired`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reauth/:
    post:
      summary: "Confirm the identity again (step-up)"
      description: |
        Sensitive actions answer `403 reauth-required` unless the session logged in or
        confirmed its identity within the last 10 minutes. Send the password, plus a TOTP
        code when the account has TOTP (only the code for accounts without a password).
        Failures count against the login backoff of the account.
      operationId: reauth
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: "The end of the new step-up window"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/passkey/login/begin/:
    post:
      summary: "Start a passkey login"
      description: "Without challenge: a discoverable login (empty allowCredentials, works with conditional UI). With the challenge of a password login: the second factor."
      operationId: passkeyLoginBegin
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginBegin"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/passkey/login/finish/:
    post:
      summary: "Complete a passkey login"
      operationId: passkeyLoginFinish
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinish"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/passkey/begin/:
    post:
      summary: "Start the passkey registration of a setup, invite or reset link"
      operationId: linkPasskeyBegin
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPasskeyBegin"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/passkey/finish/:
    post:
      summary: "Register the passkey and redeem the link"
      operationId: linkPasskeyFinish
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPasskeyFinish"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reauth/passkey/begin/:
    post:
      summary: "Start a step-up with a passkey"
      operationId: reauthPasskeyBegin
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/reauth/passkey/finish/:
    post:
      summary: "Complete a step-up with a passkey"
      operationId: reauthPasskeyFinish
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinish"
      responses:
        "200":
          description: "The end of the new step-up window"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"

  /.well-known/assetlinks.json:
    get:
      summary: "Digital Asset Links for the Android app"
      description: "Only with server.auth.webauthn.serveAssetLinks, see docs/auth.md section 12."
      operationId: assetLinks
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The statement list"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/logout/:
    post:
      summary: "End the current session"
      operationId: logout
      tags: [ Auth ]
      responses:
        "204":
          description: "The session ended, the cookie is cleared"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/link/inspect/:
    post:
      summary: "Look at a setup, invite or reset link"
      operationId: inspectLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTokenRequest"
      responses:
        "200":
          description: "The pending link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/redeem/:
    post:
      summary: "Redeem a link with a password"
      description: |
        Setup and invite links create an account (username, display name, password). Reset
        links set a new password and revoke all sessions of the account. The response is a
        session of the account.
      operationId: redeemLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRedeemRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account/:
    get:
      summary: "The signed-in user's account"
      operationId: getAccount
      tags: [ Account ]
      responses:
        "200":
          description: "The account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: "Change the profile"
      description: "Changing the username needs a recent authentication (step-up). The former username stays reserved for the account."
      operationId: updateAccount
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: "The changed account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/password/:
    put:
      summary: "Change the password"
      description: "Needs `currentPassword` or a recent authentication (step-up). All other sessions of the account end."
      operationId: changePassword
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: "Changed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: "Remove the password (accounts with a passkey; step-up)"
      operationId: removePassword
      tags: [ Account ]
      responses:
        "204":
          description: "Removed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/totp/:
    post:
      summary: "Start the TOTP enrollment (step-up)"
      description: |
        Creates a pending secret, valid 10 minutes. Show `otpauthUri` as a QR code and
        `secret` for manual entry, then confirm with a current code.
      operationId: beginTOTP
      tags: [ Account ]
      responses:
        "200":
          description: "The pending secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Disable TOTP and delete the recovery codes (step-up)"
      operationId: disableTOTP
      tags: [ Account ]
      responses:
        "204":
          description: "Disabled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/totp/confirm/:
    post:
      summary: "Activate TOTP with a current code"
      operationId: confirmTOTP
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirm"
      responses:
        "200":
          description: "TOTP is active; the recovery codes are shown only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/recovery-codes/:
    post:
      summary: "Replace the recovery codes (step-up)"
      operationId: regenerateRecoveryCodes
      tags: [ Account ]
      responses:
        "200":
          description: "The new codes, shown only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/passkeys/:
    get:
      summary: "The passkeys of the signed-in user"
      operationId: listPasskeys
      tags: [ Account ]
      responses:
        "200":
          description: "Passkeys, oldest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/passkeys/begin/:
    post:
      summary: "Start adding a passkey (step-up)"
      operationId: addPasskeyBegin
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/passkeys/finish/:
    post:
      summary: "Add the passkey"
      operationId: addPasskeyFinish
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinish"
      responses:
        "200":
          description: "The new passkey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/passkeys/{passkeyId}/:
    parameters:
      - $ref: "#/components/parameters/passkeyId"
    patch:
      summary: "Rename a passkey"
      operationId: renamePasskey
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRename"
      responses:
        "200":
          description: "The passkey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Delete a passkey (step-up)"
      description: "409 last-login-method for the last passkey of an account without password, 409 second-factor-required for the last second factor under require2FA."
      operationId: deletePasskey
      tags: [ Account ]
      responses:
        "204":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/tokens/:
    get:
      summary: "The app tokens of the signed-in user"
      operationId: listAppTokens
      tags: [ Account ]
      responses:
        "200":
          description: "App tokens, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: "Create an app token (step-up)"
      description: "App tokens authenticate as Authorization: Bearer mdp_... (or basic auth with the username and the token). The rights are the intersection of the scope and the role; they never reach /account/ or /admin/."
      operationId: createAppToken
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTokenRequest"
      responses:
        "200":
          description: "The token, returned only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAppToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/tokens/{tokenId}/:
    parameters:
      - $ref: "#/components/parameters/tokenId"
    delete:
      summary: "Revoke an app token"
      operationId: revokeAppToken
      tags: [ Account ]
      responses:
        "204":
          description: "Revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/device-links/:
    get:
      summary: "The device links of the signed-in user"
      operationId: listDeviceLinks
      tags: [ Account ]
      responses:
        "200":
          description: "Pending device links and those that expired less than 24 hours ago, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: "Create a device link to connect the Android app (step-up)"
      description: "A single-use mdd_ token valid for 5 minutes. connectUrl is {clientUrl}/connect#<base64url JSON payload>, see docs/auth.md. At most 5 pending links per account; a sixth revokes the oldest."
      operationId: createDeviceLink
      tags: [ Account ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLinkRequest"
      responses:
        "200":
          description: "The token, returned only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDeviceLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/device-links/{deviceLinkId}/:
    parameters:
      - $ref: "#/components/parameters/deviceLinkId"
    get:
      summary: "One device link, to show when it was redeemed"
      operationId: getDeviceLink
      tags: [ Account ]
      responses:
        "200":
          description: "The device link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      summary: "Revoke a pending device link"
      operationId: revokeDeviceLink
      tags: [ Account ]
      responses:
        "204":
          description: "Revoked (expired and revoked links stay as they are)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/sessions/:
    get:
      summary: "The sessions of the signed-in user"
      operationId: listAccountSessions
      tags: [ Account ]
      responses:
        "200":
          description: "Active sessions, the current one first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/sessions/{sessionId}/:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    delete:
      summary: "End one of the own sessions"
      operationId: revokeAccountSession
      tags: [ Account ]
      responses:
        "204":
          description: "The session ended"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/sessions/revoke-others/:
    post:
      summary: "End all other sessions"
      operationId: revokeOtherSessions
      tags: [ Account ]
      responses:
        "200":
          description: "How many sessions ended"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/invites/:
    get:
      summary: "List invites"
      operationId: listInvites
      tags: [ Admin ]
      parameters:
        - $ref: "#/components/parameters/linkStatus"
      responses:
        "200":
          description: "Invites, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: "Create an invite"
      operationId: createInvite
      tags: [ Admin ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "200":
          description: "The invite with its token and link (shown only now)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/invites/{linkId}/:
    parameters:
      - $ref: "#/components/parameters/linkId"
    delete:
      summary: "Revoke an invite"
      operationId: revokeInvite
      tags: [ Admin ]
      responses:
        "204":
          description: "Revoked (or already used, expired or revoked)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/:
    get:
      summary: "List the accounts"
      operationId: adminListUsers
      tags: [ Admin ]
      parameters:
        - name: status
          in: query
          required: false
          description: "Comma-separated states (active, disabled, deleted); default: all"
          schema:
            type: string
      responses:
        "200":
          description: "Accounts, by username"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/users/{userId}/:
    parameters:
      - $ref: "#/components/parameters/userId"
    patch:
      summary: "Change an account"
      description: "role and status need a step-up. Admins cannot demote or disable themselves, and the last active admin stays (409 conflict). A role change closes the user's websockets with 4003; disabling ends the sessions, app tokens and reset links."
      operationId: adminUpdateUser
      tags: [ Admin ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: "The account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      summary: "Delete an account (step-up)"
      operationId: adminDeleteUser
      tags: [ Admin ]
      responses:
        "204":
          description: "Deleted: a tombstone keeps id, username, display name and colour"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/users/{userId}/sessions/:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      summary: "The sessions of an account"
      operationId: adminUserSessions
      tags: [ Admin ]
      responses:
        "200":
          description: "Active sessions"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{userId}/sessions/revoke/:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      summary: "End all sessions of an account"
      operationId: adminRevokeUserSessions
      tags: [ Admin ]
      responses:
        "200":
          description: "How many sessions ended"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/users/{userId}/reset-link/:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      summary: "Create a reset link (step-up)"
      operationId: adminCreateResetLink
      tags: [ Admin ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetLinkRequest"
      responses:
        "200":
          description: "The link with its token and URL (shown only now)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/sessions/{sessionId}/:
    parameters:
      - $ref: "#/components/parameters/sessionId"
    delete:
      summary: "End a session of any account"
      operationId: adminRevokeSession
      tags: [ Admin ]
      responses:
        "204":
          description: "The session ended"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/reset-links/:
    get:
      summary: "List reset links"
      operationId: adminListResetLinks
      tags: [ Admin ]
      parameters:
        - $ref: "#/components/parameters/linkStatus"
      responses:
        "200":
          description: "Reset links, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Link"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reset-links/{linkId}/:
    parameters:
      - $ref: "#/components/parameters/linkId"
    delete:
      summary: "Revoke a reset link"
      operationId: adminRevokeResetLink
      tags: [ Admin ]
      responses:
        "204":
          description: "Revoked (or already used, expired or revoked)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/settings/:
    get:
      summary: "The instance settings"
      operationId: adminSettings
      tags: [ Admin ]
      responses:
        "200":
          description: "The settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      summary: "Change the instance settings (step-up)"
      operationId: adminUpdateSettings
      tags: [ Admin ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceSettings"
      responses:
        "200":
          description: "The settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit/:
    get:
      summary: "The audit log"
      operationId: adminAudit
      tags: [ Admin ]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          required: false
          description: "Continue below this event id (next of the previous page)"
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
            example: "login.failed"
        - name: account
          in: query
          required: false
          description: "Only events where this account acted or was affected"
          schema:
            type: string
      responses:
        "200":
          description: "Events, newest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /actors/:
    get:
      summary: "The actor map"
      description: |
        Maps every Automerge actor id the backend has seen to its user. Changes made by the
        server use actors of the pseudo users `:disk` (external changes) and `:server`.
      operationId: getActors
      tags: [ Auth ]
      responses:
        "200":
          description: "All actor bindings, sorted by actor id"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events/ws/:
    get:
      summary: "Events websocket"
      description: |
        Upgrades to a websocket that pushes `tree-changed` (refetch the tree) and `online`
        (who has which document open). Authentication works like the document websocket:
        a basic auth header on the upgrade request, or a ticket in the first message
        (`{"type":"hello","ticket":"…"}`). Specified in docs/sync-protocol.md, section 6.
      operationId: eventsWebsocket
      tags: [ Auth ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mkdocs/config/:
    get:
      summary: "The MkDocs configuration"
      description: "The content of `mkdocs.yml` as JSON."
      operationId: getMkDocsConfig
      tags: [ MkDocs ]
      responses:
        "200":
          description: "The parsed mkdocs.yml"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /section/:
    get:
      summary: "The whole tree"
      description: "The root section with all subsections, documents and resources, recursively."
      operationId: getTree
      tags: [ Sections ]
      responses:
        "200":
          description: "The root section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: "Create a section"
      description: "Creates a folder in the parent section."
      operationId: createSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /section/{sectionId}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
    get:
      summary: "A section"
      description: "The section with its subsections, documents and resources, recursively."
      operationId: getSection
      tags: [ Sections ]
      responses:
        "200":
          description: "The section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a section"
      description: |
        Renames the folder. The ids of the section and of everything in it change. Clients
        connected to a document in it get `document-renamed` on the websocket.
      operationId: renameSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a section"
      description: |
        Deletes the folder with everything in it. While clients are connected to a document in
        it, the request fails with `409` unless `force=true` is given.
      operationId: deleteSection
      tags: [ Sections ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/:
    post:
      summary: "Create a document"
      description: "Creates an empty `<name>.md` in the parent section."
      operationId: createDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's metadata"
      operationId: getDocument
      tags: [ Documents ]
      responses:
        "200":
          description: "The document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a document"
      description: |
        Renames the file to `<name>.md`. The id changes. Connected clients get
        `document-renamed` on the websocket and reconnect to the new id.
      operationId: renameDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a document"
      description: |
        While clients are connected to the document, the request fails with `409` unless
        `force=true` is given. Connected clients then get `document-deleted`.
      operationId: deleteDocument
      tags: [ Documents ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's content"
      description: "The markdown text. While the document is open for editing, this is the live text."
      operationId: getDocumentContent
      tags: [ Documents ]
      responses:
        "200":
          description: "The markdown text"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/authorship/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Per-character authorship of a document"
      description: |
        Which actor (and user) inserted each character of the current text, derived from the
        Automerge history. Positions are Unicode code point offsets into the text at the
        returned heads. See docs/sync-protocol.md, section 7.
      operationId: getDocumentAuthorship
      tags: [ Documents ]
      responses:
        "200":
          description: "The authorship runs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Revision history of a document"
      description: |
        The git commits that changed the file, newest first, following renames. Requires
        `git.enabled`; without it the response is 404.
      operationId: getDocumentHistory
      tags: [ History ]
      parameters:
        - name: limit
          in: query
          required: false
          description: "Maximum number of commits (1 to 1000, default 100)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: "The commits"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/diff/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Diff between two revisions"
      description: |
        Unified diff of the document between two revisions. A revision is a commit hash (7 to
        64 hex characters) from the history, or `current` for the live text.
      operationId: getDocumentRevisionDiff
      tags: [ History ]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Default: current"
          schema:
            type: string
            default: current
      responses:
        "200":
          description: "The unified diff, empty if the texts are equal"
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    get:
      summary: "A document's content at a revision"
      operationId: getDocumentRevisionContent
      tags: [ History ]
      responses:
        "200":
          description: "The markdown text at that revision"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/restore/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    post:
      summary: "Restore a revision"
      description: |
        Changes the live text to the text at that revision. The server applies it as an
        Automerge change, so connected clients merge it like any other edit and nothing
        typed concurrently is lost. In git, the change counts for the requesting user.
        Requires the editor or admin role.
      operationId: restoreDocumentRevision
      tags: [ History ]
      responses:
        "204":
          description: "Restored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/ws/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Realtime editing websocket"
      description: |
        Upgrades to a websocket for realtime collaborative editing of the document. The
        protocol is specified in docs/sync-protocol.md. Authenticate with a basic auth header
        on the upgrade request or with a ticket (`POST /auth/ws-ticket/`) in the first
        message (`hello`). Without either, the upgrade succeeds and the connection is
        closed with code 4001 if no valid ticket arrives within 10 seconds.
      operationId: documentWebsocket
      tags: [ Documents ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The Origin header is not in server.cors.allowedOrigins."
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's metadata"
      operationId: getResource
      tags: [ Resources ]
      responses:
        "200":
          description: "The resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a resource"
      operationId: renameResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a resource"
      operationId: deleteResource
      tags: [ Resources ]
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/content/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's content"
      operationId: getResourceContent
      tags: [ Resources ]
      responses:
        "200":
          description: "The file, with a content type derived from its name"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{sectionId}/{name}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
      - name: name
        in: path
        required: true
        description: "File name of the new resource"
        schema:
          type: string
    post:
      summary: "Upload a resource"
      description: "Uploads a file into the section. The content is the multipart field `file`."
      operationId: uploadResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "The new resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: "__Host-mkdocseditor_session"
      description: "Session cookie of the web client (`mkdocseditor_session` over plain HTTP)"
    bearerAuth:
      type: http
      scheme: bearer
      description: "A session token (`mds_…`) of a native client"
    basicAuth:
      type: http
      scheme: basic
      description: "Only with `server.auth.legacyBasicAuth` (transition)"

  parameters:
    sectionId:
      name: sectionId
      in: path
      required: true
      description: "Id of a section (`root` for the root section)"
      schema:
        type: string
    documentId:
      name: documentId
      in: path
      required: true
      description: "Id of a document"
      schema:
        type: string
    revision:
      name: revision
      in: path
      required: true
      description: "Commit hash from the history, 7 to 64 hex characters"
      schema:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
    resourceId:
      name: resourceId
      in: path
      required: true
      description: "Id of a resource"
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      description: "Id of an account"
      schema:
        type: string
    deviceLinkId:
      name: deviceLinkId
      in: path
      required: true
      description: "Id of a device link"
      schema:
        type: string
    tokenId:
      name: tokenId
      in: path
      required: true
      description: "Id of an app token"
      schema:
        type: string
    passkeyId:
      name: passkeyId
      in: path
      required: true
      description: "Id of a passkey"
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      description: "Id of a session"
      schema:
        type: string
    linkId:
      name: linkId
      in: path
      required: true
      description: "Id of a link"
      schema:
        type: string
    linkStatus:
      name: status
      in: query
      required: false
      description: "Only links in this state"
      schema:
        type: string
        enum: [ pending, used, expired, revoked ]
    force:
      name: force
      in: query
      required: false
      description: "Delete even while clients are connected to an affected document"
      schema:
        type: boolean
        default: false

  responses:
    TooManyRequests:
      description: "Rate limited; retry after the `Retry-After` header (seconds)"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "Invalid request, for example a name with a slash or a leading dot"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Missing or invalid credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The user's role does not allow this"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No item with this id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "The target already exists, or clients are connected to the document"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: "Unexpected error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Section:
      type: object
      required: [ type, id, name, subsections, documents, resources ]
      properties:
        type:
          type: string
          enum: [ section ]
        id:
          type: string
          example: "root"
        name:
          type: string
          description: "Folder name"
        subsections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    Document:
      type: object
      required: [ type, id, name, filesize, modtime, url ]
      properties:
        type:
          type: string
          enum: [ document ]
        id:
          type: string
          example: "5772684240079201105"
        name:
          type: string
          description: "File name without the .md extension"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time
        url:
          type: string
          description: "Path of the page relative to the site root, for example `guide/setup/`"

    Resource:
      type: object
      required: [ type, id, name, filesize, modtime ]
      properties:
        type:
          type: string
          enum: [ resource ]
        id:
          type: string
        name:
          type: string
          description: "File name"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time

    NewItemRequest:
      type: object
      required: [ parent, name ]
      properties:
        parent:
          type: string
          description: "Id of the parent section"
        name:
          type: string
          description: "Name of the new section, or of the document without .md"

    RenameRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: "New name (for documents without .md)"

    User:
      type: object
      required: [ id, username, displayName, role, color ]
      properties:
        id:
          type: string
          description: "Stable account id (`anonymous` when authentication is off)"
        username:
          type: string
          description: "Current username; it can change, the id does not"
        displayName:
          type: string
        role:
          type: string
          enum: [ admin, editor, reader ]
        color:
          type: string
          example: "#1971c2"

    WhoAmI:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ authMethod, secondFactorSetupRequired ]
          properties:
            authMethod:
              type: string
              enum: [ session, app-token, basic, anonymous ]
            secondFactorSetupRequired:
              type: boolean
              description: "The instance requires 2FA and this account has none yet: only the 2FA setup endpoints work"
            sessionId:
              type: string

    UserWithSetupState:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ secondFactorSetupRequired, passkeyCount ]
          properties:
            secondFactorSetupRequired:
              type: boolean
            passkeyCount:
              type: integer
              description: "Number of passkeys of the account, to offer a passkey right after sign-in"

    AuthStatus:
      type: object
      required: [ setupRequired, authDisabled, passkeys, passwordPolicy, legacyBasicAuth ]
      properties:
        setupRequired:
          type: boolean
          description: "No account exists; the first admin is created with a setup link"
        authDisabled:
          type: boolean
        passkeys:
          type: object
          required: [ enabled ]
          properties:
            enabled:
              type: boolean
            rpId:
              type: string
        passwordPolicy:
          type: object
          required: [ minLength, maxLength ]
          properties:
            minLength:
              type: integer
            maxLength:
              type: integer
        legacyBasicAuth:
          type: boolean

    SessionFields:
      type: object
      properties:
        sessionType:
          type: string
          enum: [ cookie, bearer ]
          default: cookie
          description: "`cookie` sets the HttpOnly session cookie, `bearer` returns the token"
        deviceName:
          type: string
          maxLength: 64

    LoginRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ username, password ]
          properties:
            username:
              type: string
            password:
              type: string
              format: password

    LinkTokenRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          description: "The link token (`mdl_…`) from the link fragment"

    LinkRedeemRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ token, password ]
          properties:
            token:
              type: string
            username:
              type: string
              description: "Setup and invite links only"
            displayName:
              type: string
              description: "Setup and invite links only, defaults to the username"
            password:
              type: string
              format: password

    LinkInspection:
      type: object
      required: [ kind, expiresAt ]
      properties:
        kind:
          type: string
          enum: [ setup, invite, reset ]
        role:
          type: string
          enum: [ admin, editor, reader ]
        note:
          type: string
        username:
          type: string
          description: "Reset links: the account"
        displayName:
          type: string
        resetSecondFactors:
          type: boolean
        expiresAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [ id, type, deviceName, userAgent, ip, createdAt, lastUsedAt, expiresAt, idleExpiresAt, current ]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ cookie, bearer ]
        deviceName:
          type: string
        userAgent:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: "Absolute expiry"
        idleExpiresAt:
          type: string
          format: date-time
          description: "Expiry if the session is not used"
        current:
          type: boolean

    SessionResponse:
      type: object
      required: [ status, user, session ]
      properties:
        status:
          type: string
          enum: [ ok ]
        user:
          $ref: "#/components/schemas/UserWithSetupState"
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: "Bearer sessions only: the session token (`mds_…`)"

    SecondFactorRequired:
      type: object
      required: [ status, challenge, methods, expiresAt ]
      properties:
        status:
          type: string
          enum: [ second-factor-required ]
        challenge:
          type: string
          description: "Login challenge (`mdc_…`), valid 5 minutes and 5 attempts"
        methods:
          type: array
          items:
            type: string
            enum: [ totp, recovery-code, passkey ]
        expiresAt:
          type: string
          format: date-time

    SecondFactorRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ challenge ]
          description: "Exactly one of `code` and `recoveryCode`"
          properties:
            challenge:
              type: string
            code:
              type: string
              example: "123456"
            recoveryCode:
              type: string
              example: "abcd-efgh-jkmn"

    ReauthRequest:
      type: object
      properties:
        password:
          type: string
          format: password
        code:
          type: string

    Reauthenticated:
      type: object
      required: [ reauthenticatedUntil ]
      properties:
        reauthenticatedUntil:
          type: string
          format: date-time

    Account:
      allOf:
        - $ref: "#/components/schemas/UserWithSetupState"
        - type: object
          required: [ email, createdAt, hasPassword, totpEnabled, recoveryCodesLeft, passkeyCount, require2FA, reauthenticatedUntil ]
          properties:
            email:
              type: string
            createdAt:
              type: string
              format: date-time
            hasPassword:
              type: boolean
            totpEnabled:
              type: boolean
            recoveryCodesLeft:
              type: integer
            passkeyCount:
              type: integer
            require2FA:
              type: boolean
            reauthenticatedUntil:
              type: string
              format: date-time
              nullable: true
              description: "End of the step-up window, null when it has passed"

    AccountUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
          maxLength: 64
        color:
          type: string
          example: "#1971c2"
        email:
          type: string
          description: "An empty string removes the email"

    PasswordChange:
      type: object
      required: [ newPassword ]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    TOTPEnrollment:
      type: object
      required: [ secret, otpauthUri, expiresAt ]
      properties:
        secret:
          type: string
          description: "Base32, for manual entry"
        otpauthUri:
          type: string
          example: "otpauth://totp/MkDocsEditor:markus?secret=JBSWY3DPEHPK3PXP&issuer=MkDocsEditor&algorithm=SHA1&digits=6&period=30"
        expiresAt:
          type: string
          format: date-time

    TOTPConfirm:
      type: object
      required: [ code ]
      properties:
        code:
          type: string

    RecoveryCodes:
      type: object
      required: [ recoveryCodes ]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            example: "abcd-efgh-jkmn"

    EmptyObject:
      type: object

    Ceremony:
      type: object
      required: [ ceremonyId, publicKey ]
      properties:
        ceremonyId:
          type: string
          description: "Valid 5 minutes, single use"
        publicKey:
          type: object
          additionalProperties: true
          description: "PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON (binary fields base64url)"

    WebAuthnCredential:
      type: object
      additionalProperties: true
      description: "The standard JSON of a PublicKeyCredential (RegistrationResponseJSON or AuthenticationResponseJSON)"
      required: [ id, rawId, type, response ]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [ public-key ]
        response:
          type: object
          additionalProperties: true

    PasskeyLoginBegin:
      type: object
      properties:
        challenge:
          type: string
          description: "The challenge of a password login (passkey as second factor)"

    PasskeyLoginFinish:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ ceremonyId, credential ]
          properties:
            ceremonyId:
              type: string
            credential:
              $ref: "#/components/schemas/WebAuthnCredential"

    LinkPasskeyBegin:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
        username:
          type: string
          description: "Setup and invite links only"
        displayName:
          type: string

    LinkPasskeyFinish:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ ceremonyId, credential ]
          properties:
            ceremonyId:
              type: string
            credential:
              $ref: "#/components/schemas/WebAuthnCredential"
            passkeyName:
              type: string
              maxLength: 64

    PasskeyFinish:
      type: object
      required: [ ceremonyId, credential ]
      properties:
        ceremonyId:
          type: string
        credential:
          $ref: "#/components/schemas/WebAuthnCredential"
        name:
          type: string
          maxLength: 64
          description: "Default: the provider name (from the AAGUID) or Passkey"

    PasskeyRename:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 64

    Passkey:
      type: object
      required: [ id, name, createdAt, lastUsedAt, backedUp, transports ]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        backedUp:
          type: boolean
          description: "Synced passkey (backup state flag)"
        transports:
          type: array
          items:
            type: string
        provider:
          type: string
          description: "Known passkey provider of the AAGUID, for example Bitwarden"

    ServerInfo:
      type: object
      required: [ name, version, protocolVersion, backendUrl, wikiUrl, webClientUrl, setupRequired, authDisabled, passkeys, loginMethods, require2FA ]
      properties:
        name:
          type: string
          description: "server.instanceName, else the host of wikiUrl, webClientUrl or the request"
        version:
          type: string
          description: "Backend build version (dev for local builds)"
        protocolVersion:
          type: integer
          description: "Sync protocol version (docs/sync-protocol.md)"
        backendUrl:
          type: string
          nullable: true
        wikiUrl:
          type: string
          nullable: true
        webClientUrl:
          type: string
          nullable: true
        setupRequired:
          type: boolean
        authDisabled:
          type: boolean
        passkeys:
          type: object
          required: [ enabled ]
          properties:
            enabled:
              type: boolean
            rpId:
              type: string
        loginMethods:
          type: array
          items:
            type: string
            enum: [ password, passkey, device-link ]
        require2FA:
          type: boolean

    DeviceLink:
      type: object
      required: [ id, deviceName, createdAt, expiresAt, status, redeemedAt, redeemedDeviceName, sessionId ]
      properties:
        id:
          type: string
        deviceName:
          type: string
          nullable: true
          description: "Hint from the creator"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ pending, redeemed, expired, revoked ]
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        redeemedDeviceName:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
          description: "The session created by the redeem"

    DeviceLinkRequest:
      type: object
      properties:
        deviceName:
          type: string
          maxLength: 64

    CreatedDeviceLink:
      type: object
      required: [ deviceLink, token, expiresAt, connectUrl ]
      properties:
        deviceLink:
          $ref: "#/components/schemas/DeviceLink"
        token:
          type: string
          description: "mdd_..., returned only once"
        expiresAt:
          type: string
          format: date-time
        connectUrl:
          type: string
          nullable: true
          description: "{clientUrl}/connect#<payload>; null without server.auth.clientUrl"

    DeviceLinkRedeemRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
        username:
          type: string
          description: "Optional; must match the account when sent"
        sessionType:
          type: string
          enum: [ cookie, bearer ]
          default: bearer
        deviceName:
          type: string
          maxLength: 64

    AppToken:
      type: object
      required: [ id, name, scope, createdAt, lastUsedAt, expiresAt ]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [ read, write ]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AppTokenRequest:
      type: object
      required: [ name, scope ]
      properties:
        name:
          type: string
          maxLength: 64
        scope:
          type: string
          enum: [ read, write ]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: "Absent: no expiry"

    CreatedAppToken:
      type: object
      required: [ appToken, token ]
      properties:
        appToken:
          $ref: "#/components/schemas/AppToken"
        token:
          type: string
          description: "mdp_..., returned only once"

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ email, status, createdAt, lastLoginAt, hasPassword, totpEnabled, passkeyCount, sessionCount ]
          properties:
            email:
              type: string
            status:
              type: string
              enum: [ active, disabled, deleted ]
            createdAt:
              type: string
              format: date-time
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            hasPassword:
              type: boolean
            totpEnabled:
              type: boolean
            passkeyCount:
              type: integer
            sessionCount:
              type: integer

    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [ admin, editor, reader ]
        status:
          type: string
          enum: [ active, disabled ]
        username:
          type: string
        displayName:
          type: string
        color:
          type: string
        email:
          type: string

    ResetLinkRequest:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: "Default 60"
        resetSecondFactors:
          type: boolean
          description: "Remove TOTP, recovery codes and passkeys when the link is redeemed"

    InstanceSettings:
      type: object
      properties:
        require2FA:
          type: boolean

    AuditEvent:
      type: object
      required: [ id, time, type, actor, target, ip, userAgent, details ]
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        type:
          type: string
        actor:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        target:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        ip:
          type: string
        userAgent:
          type: string
        details:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [ events, next ]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next:
          type: integer
          nullable: true

    Revoked:
      type: object
      required: [ revoked ]
      properties:
        revoked:
          type: integer

    Link:
      type: object
      required: [ id, kind, note, accountId, resetSecondFactors, createdBy, createdAt, expiresAt, usedAt, usedBy, revokedAt, status ]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ setup, invite, reset ]
        role:
          type: string
          enum: [ admin, editor, reader ]
        note:
          type: string
        accountId:
          type: string
          nullable: true
        resetSecondFactors:
          type: boolean
        createdBy:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        usedBy:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        revokedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ pending, used, expired, revoked ]

    CreateInviteRequest:
      type: object
      required: [ role ]
      properties:
        role:
          type: string
          enum: [ admin, editor, reader ]
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          description: "Default 168 (7 days)"
        note:
          type: string
          maxLength: 200

    CreatedLink:
      type: object
      required: [ token, url ]
      properties:
        invite:
          $ref: "#/components/schemas/Link"
        link:
          $ref: "#/components/schemas/Link"
        token:
          type: string
          description: "The link token, returned only once"
        url:
          type: string
          nullable: true
          description: "`{clientUrl}/{kind}#{token}`, null without `server.auth.clientUrl`"

    Ticket:
      type: object
      required: [ ticket, expiresAt ]
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time

    Actor:
      type: object
      required: [ actorId, username, displayName, color ]
      properties:
        actorId:
          type: string
          description: "Automerge actor id, hex"
        accountId:
          type: string
          description: "Account the actor is bound to, empty for `:disk` / `:server`"
        username:
          type: string
          description: "Current username of the account, or `:disk` / `:server` for changes made by the server"
        displayName:
          type: string
        color:
          type: string

    Authorship:
      type: object
      required: [ heads, runs ]
      properties:
        heads:
          type: array
          description: "Automerge heads (hex) of the text the runs describe"
          items:
            type: string
        runs:
          type: array
          description: "Consecutive runs covering the whole text, in order"
          items:
            $ref: "#/components/schemas/AuthorshipRun"

    AuthorshipRun:
      type: object
      required: [ start, end, actorId, username ]
      properties:
        start:
          type: integer
          description: "First code point of the run"
        end:
          type: integer
          description: "Code point after the run"
        actorId:
          type: string
        accountId:
          type: string
          description: "Account of the actor, empty for server changes or if unknown"
        username:
          type: string
          description: "Current username of the account, `:disk` / `:server` for server changes, empty if unknown"

    HistoryEntry:
      type: object
      required: [ revision, time, author, coAuthors, message, path ]
      properties:
        revision:
          type: string
          description: "Commit hash"
        time:
          type: string
          format: date-time
          description: "Author time"
        author:
          $ref: "#/components/schemas/HistoryAuthor"
        coAuthors:
          type: array
          description: "From the Co-authored-by trailers"
          items:
            $ref: "#/components/schemas/HistoryAuthor"
        message:
          type: string
          description: "Commit subject"
        path:
          type: string
          description: "Path of the file in this commit, relative to the docs folder"

    HistoryAuthor:
      type: object
      required: [ name, email, username ]
      properties:
        name:
          type: string
        email:
          type: string
        username:
          type: string
          description: "Current username of the account this author resolves to (by `<username>@mkdocseditor.invalid`, including former usernames, or by the account email), empty if none"
        accountId:
          type: string
          description: "Id of that account, empty if none"

    Error:
      type: object
      required: [ name, message ]
      properties:
        name:
          type: string
          example: "Not found"
        code:
          type: string
          description: "Machine-readable error code, see docs/auth.md section 10"
          example: "not-found"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

      operationId: getActors
      tags: [ Auth ]
      responses:
        "200":
          description: "All actor bindings, sorted by actor id"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /avatars/{userId}/{avatar}/:
    parameters:
      - $ref: "#/components/parameters/userId"
      - name: avatar
        in: path
        required: true
        description: "The `avatar` of the account"
        schema:
          type: string
    get:
      summary: "A profile picture"
      description: |
        The URL changes with every new picture, so the response may be cached forever. A
        version that is no longer the current one gives 404. Web clients load it with
        `<img crossorigin="use-credentials">`.
      operationId: getAvatar
      tags: [ Auth ]
      responses:
        "200":
          description: "256x256 JPEG"
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=31536000, immutable"
            ETag:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: "Not modified (If-None-Match)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/ws/:
    get:
      summary: "Events websocket"
      description: |
        Upgrades to a websocket that pushes `tree-changed` (refetch the tree) and `online`
        (who has which document open). Authentication works like the document websocket:
        an `Authorization` header on the upgrade request, or a ticket in the first message
        (`{"type":"hello","ticket":"…"}`). Specified in docs/sync-protocol.md, section 6.
      operationId: eventsWebsocket
      tags: [ Auth ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wiki/config/:
    get:
      summary: "The renderer settings of mkdocs.yml"
      description: |
        Theme, plugins and Markdown extensions with their options, for clients that render pages
        (docs/page-meta.md). Values tagged `!ENV` and keys that look like secrets are left out, and
        so is everything else of mkdocs.yml. `features` of `GET /server-info/` contains
        `wiki-config`.
      operationId: getWikiConfig
      tags: [ MkDocs ]
      responses:
        "200":
          description: "The settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: "mkdocs.yml cannot be read"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /qr/:
    get:
      summary: "All QR code keys"
      description: |
        The keys of the front matter `qr` of all documents, the conflicts, the invalid values and
        the keys no document has any more (docs/qr.md). Every role. `features` of
        `GET /server-info/` contains `qr-codes`.
      operationId: getQRCodes
      tags: [ QR ]
      responses:
        "200":
          description: "The keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /qr/{key}/:
    get:
      summary: "The page of a QR code key"
      description: |
        Every role. The key is compared in lower case. With `scan=1` the scan time is recorded
        for a known key (200, 409, 410); without it the request is a preview.
      operationId: getQRCode
      tags: [ QR ]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: "waschmaschine"
        - name: scan
          in: query
          schema:
            type: string
            enum: [ "1" ]
      responses:
        "200":
          description: "One document has the key"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "No document ever had the key, or it is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `qr-conflict`: more than one document has the key. `details` is
            `{key, items: [QRItem], lastScannedAt}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: |
            `qr-gone`: no document has the key any more. `details` is
            `{key, label, lastPath, lastScannedAt}`, as QRGone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /search/:
    get:
      summary: "Full text search over the documents"
      description: |
        Documents that contain every word of `q` (case-insensitive) in their text, title or
        path, the best matches first: a word in the title or path counts more than one in the
        text. Searches the live text of open documents. See docs/content-api.md.
      operationId: search
      tags: [ Documents ]
      parameters:
        - name: q
          in: query
          required: true
          description: "Words to search for, 1 to 200 characters"
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Maximum number of results (1 to 100, default 20)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "The matching documents"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mcp/:
    post:
      summary: "MCP server (streamable HTTP)"
      description: |
        The Model Context Protocol server for LLM agents: JSON-RPC messages of the MCP
        streamable HTTP transport, without sessions (no `Mcp-Session-Id`). Requests need an
        `Authorization` header, usually `Bearer mdp_…`; the session cookie is not accepted.
        Readers and app tokens with the scope `read` get only the read tools. OAuth access tokens
        (`mdo_…`, docs/oauth.md) work here and nowhere else. A `401` carries
        `WWW-Authenticate: Bearer resource_metadata="<backendUrl>/.well-known/oauth-protected-resource/mcp"`.
        See docs/mcp.md.
      operationId: postMCP
      tags: [ MCP ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "A JSON-RPC request or notification of MCP"
      responses:
        "200":
          description: "The JSON-RPC response"
          content:
            application/json:
              schema:
                type: object
        "202":
          description: "A notification was accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: "MCP server: no event stream"
      description: "Without sessions there is no server-sent event stream: `405`."
      operationId: getMCP
      tags: [ MCP ]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: "Not supported"
    delete:
      summary: "MCP server: no sessions to end"
      description: "Without sessions there is nothing to end: `405`."
      operationId: deleteMCP
      tags: [ MCP ]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          description: "Not supported"

  /.well-known/oauth-protected-resource/:
    get:
      summary: "Protected resource metadata of the MCP endpoint (RFC 9728)"
      description: |
        Public. Also served at the root of the host (outside `/api`), where MCP clients look
        first: `/.well-known/oauth-protected-resource` and
        `/.well-known/oauth-protected-resource/api/mcp`. 404 when authentication is disabled.
      operationId: getProtectedResourceMetadata
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
        "404":
          $ref: "#/components/responses/Error"
  /.well-known/oauth-protected-resource/mcp/:
    get:
      summary: "Protected resource metadata (the URL of WWW-Authenticate)"
      description: "Same as `/.well-known/oauth-protected-resource/`."
      operationId: getProtectedResourceMetadataMCP
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
  /.well-known/oauth-protected-resource/api/mcp/:
    get:
      summary: "Protected resource metadata (RFC 9728 location of <origin>/api/mcp)"
      description: "Same as `/.well-known/oauth-protected-resource/`, meant for the root of the host."
      operationId: getProtectedResourceMetadataRoot
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedResourceMetadata"
  /.well-known/oauth-authorization-server/:
    get:
      summary: "Authorization server metadata (RFC 8414)"
      description: |
        Public. The issuer is the backend URL (`server.backendUrl`, else `<origin>/api`). Also
        served at the root of the host, as `/.well-known/oauth-authorization-server`,
        `/.well-known/oauth-authorization-server/api`, `/.well-known/openid-configuration` and
        `/.well-known/openid-configuration/api`.
      operationId: getAuthServerMetadata
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServerMetadata"
        "404":
          $ref: "#/components/responses/Error"
  /.well-known/oauth-authorization-server/api/:
    get:
      summary: "Authorization server metadata (RFC 8414 location of the issuer <origin>/api)"
      description: "Same as `/.well-known/oauth-authorization-server/`, meant for the root of the host."
      operationId: getAuthServerMetadataRoot
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServerMetadata"
  /.well-known/openid-configuration/:
    get:
      summary: "Authorization server metadata (OpenID Connect location)"
      description: "Same as `/.well-known/oauth-authorization-server/`; there is no OpenID Connect."
      operationId: getOpenIDConfiguration
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServerMetadata"
  /.well-known/openid-configuration/api/:
    get:
      summary: "Authorization server metadata (OpenID Connect location of the issuer <origin>/api)"
      description: "Same as `/.well-known/oauth-authorization-server/`, meant for the root of the host."
      operationId: getOpenIDConfigurationRoot
      tags: [ OAuth ]
      security: [ ]
      responses:
        "200":
          description: "The metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthServerMetadata"

  /oauth/register/:
    post:
      summary: "Register a client (RFC 7591)"
      description: |
        Public, rate limited per address. Every client is public (`token_endpoint_auth_method`
        `none`) and uses PKCE. Redirect URIs are https URLs, http URLs of `127.0.0.1`, `[::1]`
        or `localhost` (any port matches later, RFC 8252), or private-use schemes of native
        apps; never `javascript:`, `data:` and the like, no fragments. Clients that never get a
        token are deleted after 24 hours.
      operationId: oauthRegister
      tags: [ OAuth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthClientMetadata"
      responses:
        "201":
          description: "The registered client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClient"
        "400":
          description: "`invalid_redirect_uri` or `invalid_client_metadata`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/Error"
  /oauth/authorize/:
    get:
      summary: "Start an authorization (browser)"
      description: |
        Public. Checks the request and redirects (302) the browser to the consent page of the
        web client, `<clientUrl>/connect/authorize?request=<id>`; the request waits there 10
        minutes. Requires `response_type=code`, a registered `redirect_uri` and PKCE with
        `code_challenge_method=S256`. `scope` is `read` or `write` (also `read write`;
        default write), `resource` must be the MCP endpoint if given. An unknown client or
        redirect URI is a plain `400` page; other errors redirect to the client with `error`
        and `state`.
      operationId: oauthAuthorize
      tags: [ OAuth ]
      security: [ ]
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [ code ] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [ S256 ] } }
        - { name: state, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string } }
        - { name: resource, in: query, schema: { type: string } }
      responses:
        "302":
          description: "To the consent page, or back to the client with an error"
        "400":
          description: "Unknown client or redirect URI (text/plain)"
  /oauth/token/:
    post:
      summary: "Token endpoint"
      description: |
        Public, form-encoded. `authorization_code` (with `code`, `redirect_uri`, `client_id`,
        `code_verifier`, optional `resource`) or `refresh_token` (with `refresh_token`,
        `client_id`, optional `scope=read` to lower it). Access tokens (`mdo_…`) last an hour
        and only work at `/mcp`; refresh tokens (`mdr_…`) last 30 days and rotate. A code
        works once and a refresh token too: using either again revokes the grant.
      operationId: oauthToken
      tags: [ OAuth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ grant_type ]
              properties:
                grant_type: { type: string, enum: [ authorization_code, refresh_token ] }
                code: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                scope: { type: string }
                resource: { type: string }
      responses:
        "200":
          description: "New tokens"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: "`invalid_grant`, `invalid_request`, `invalid_scope`, `invalid_target`, `unsupported_grant_type`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: "`invalid_client`: no client_id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/Error"
  /oauth/revoke/:
    post:
      summary: "Revoke a token (RFC 7009)"
      description: "Public, form-encoded `token`: an access or refresh token. Ends the whole grant. Unknown tokens are no error."
      operationId: oauthRevoke
      tags: [ OAuth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ token ]
              properties:
                token: { type: string }
                token_type_hint: { type: string }
      responses:
        "200":
          description: "Revoked, or unknown"
  /oauth/requests/{id}/:
    get:
      summary: "A pending authorization request (consent page)"
      description: "Sessions only. 404 for unknown, decided and expired requests."
      operationId: getOAuthRequest
      tags: [ OAuth ]
      parameters:
        - { name: id, in: path, required: true, description: "Id of the request (from `?request=` of the consent page)", schema: { type: string } }
      responses:
        "200":
          description: "The request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /oauth/requests/{id}/approve/:
    post:
      summary: "Approve a request"
      description: |
        Sessions only, with a recent login like creating an app token (`403 reauth-required`,
        then `POST /auth/reauth/`). The body may lower the scope to `read`; readers always get
        `read`. The answer is where the browser goes next: the client's redirect URI with
        `code` and `state`.
      operationId: approveOAuthRequest
      tags: [ OAuth ]
      parameters:
        - { name: id, in: path, required: true, description: "Id of the request (from `?request=` of the consent page)", schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthDecisionRequest"
      responses:
        "200":
          description: "Approved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"
  /oauth/requests/{id}/deny/:
    post:
      summary: "Deny a request"
      description: "Sessions only. The answer is the client's redirect URI with `error=access_denied` and `state`."
      operationId: denyOAuthRequest
      tags: [ OAuth ]
      parameters:
        - { name: id, in: path, required: true, description: "Id of the request (from `?request=` of the consent page)", schema: { type: string } }
      responses:
        "200":
          description: "Denied"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDecision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/Error"

  /mkdocs/config/:
    get:
      summary: "The MkDocs configuration"
      description: "The content of `mkdocs.yml` as JSON."
      operationId: getMkDocsConfig
      tags: [ MkDocs ]
      responses:
        "200":
          description: "The parsed mkdocs.yml"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /section/:
    get:
      summary: "The whole tree"
      description: "The root section with all subsections, documents and resources, recursively."
      operationId: getTree
      tags: [ Sections ]
      responses:
        "200":
          description: "The root section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: "Create a section"
      description: "Creates a folder in the parent section."
      operationId: createSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /section/{sectionId}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
    get:
      summary: "A section"
      description: "The section with its subsections, documents and resources, recursively."
      operationId: getSection
      tags: [ Sections ]
      responses:
        "200":
          description: "The section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a section"
      description: |
        Renames the folder. The ids of the section and of everything in it change. Clients
        connected to a document in it get `document-renamed` on the websocket. References to
        the section and everything in it are updated, like `POST /move/` with only `name`
        (docs/references.md section 5); use that endpoint with `dryRun` for a preview.
      operationId: renameSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a section"
      description: |
        Deletes the folder with everything in it. While clients are connected to a document in
        it, the request fails with `409` unless `force=true` is given.
      operationId: deleteSection
      tags: [ Sections ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/:
    post:
      summary: "Create a document"
      description: "Creates an empty `<name>.md` in the parent section."
      operationId: createDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's metadata"
      operationId: getDocument
      tags: [ Documents ]
      responses:
        "200":
          description: "The document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a document"
      description: |
        Renames the file to `<name>.md`. The id changes. Connected clients get
        `document-renamed` on the websocket and reconnect to the new id. References to the
        document are updated, like `POST /move/` with only `name` (docs/references.md
        section 5); use that endpoint with `dryRun` for a preview.
      operationId: renameDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a document"
      description: |
        While clients are connected to the document, the request fails with `409` unless
        `force=true` is given. Connected clients then get `document-deleted`.
      operationId: deleteDocument
      tags: [ Documents ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's content"
      description: |
        The markdown text. While the document is open for editing, this is the live text. The
        `ETag` header holds its revision, the base for `PUT` on this path and for
        `POST /document/{documentId}/edits/`. See docs/content-api.md.
      operationId: getDocumentContent
      tags: [ Documents ]
      responses:
        "200":
          description: "The markdown text"
          headers:
            ETag:
              description: |
                The revision in quotes. Missing for files that are not valid UTF-8, which
                cannot be edited.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Replace a document's content"
      description: |
        Writes the full text, merged three-way: the difference between the text of
        `baseRevision` and `content` is applied to the document as of `baseRevision`, and that
        is merged with everything that changed since. Concurrent edits elsewhere survive.
        Connected clients see the change live. Rate limited per app token (or account).
        Prefer `POST /document/{documentId}/edits/` for small changes. See docs/content-api.md.
      operationId: putDocumentContent
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteContentRequest"
      responses:
        "200":
          $ref: "#/components/responses/Revision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "428":
          description: "`baseRevision` is missing (code `base-revision-required`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /document/{documentId}/edits/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    post:
      summary: "Edit a document by unique search strings"
      description: |
        Applies the edits in order. Each `old` must occur exactly once in the text the edits
        before it left, otherwise nothing is applied and the answer is 409 with the code
        `edit-not-found` or `edit-ambiguous` and the index of the edit in `details.index`.
        Without `baseRevision` the edits apply to the current text; with it, to the text of
        that revision, merged with everything that changed since. The edits are applied as
        splices of an actor of the account (marked with the app token, see `Actor.agent`), so
        connected clients see them live and concurrent typing merges. Rate limited per app
        token (or account). See docs/content-api.md.
      operationId: postDocumentEdits
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRequest"
      responses:
        "200":
          $ref: "#/components/responses/Revision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ContentConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /document/{documentId}/authorship/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Per-character authorship of a document"
      description: |
        Which actor (and user) inserted each character of the current text, derived from the
        Automerge history. Positions are Unicode code point offsets into the text at the
        returned heads. See docs/sync-protocol.md, section 7.
      operationId: getDocumentAuthorship
      tags: [ Documents ]
      responses:
        "200":
          description: "The authorship runs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Revision history of a document"
      description: |
        The git commits that changed the file, newest first, following renames. Requires
        `git.enabled`; without it the response is 404.
      operationId: getDocumentHistory
      tags: [ History ]
      parameters:
        - name: limit
          in: query
          required: false
          description: "Maximum number of commits (1 to 1000, default 100)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: "The commits"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/diff/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Diff between two revisions"
      description: |
        Unified diff of the document between two revisions. A revision is a commit hash (7 to
        64 hex characters) from the history, or `current` for the live text. With
        `format=json` the diff is structured, with the heading anchors of the feed.
      operationId: getDocumentRevisionDiff
      tags: [ History ]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Default: current"
          schema:
            type: string
            default: current
        - name: format
          in: query
          required: false
          description: "`json` for a structured diff; absent: unified diff as text"
          schema:
            type: string
            enum: [ json ]
      responses:
        "200":
          description: "The unified diff, empty if the texts are equal; with format=json the structured diff, no hunks if equal"
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    get:
      summary: "A document's content at a revision"
      operationId: getDocumentRevisionContent
      tags: [ History ]
      responses:
        "200":
          description: "The markdown text at that revision"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/restore/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    post:
      summary: "Restore a revision"
      description: |
        Changes the live text to the text at that revision. The server applies it as an
        Automerge change, so connected clients merge it like any other edit and nothing
        typed concurrently is lost. In git, the change counts for the requesting user.
        Requires the editor or admin role.
      operationId: restoreDocumentRevision
      tags: [ History ]
      responses:
        "204":
          description: "Restored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/ws/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Realtime editing websocket"
      description: |
        Upgrades to a websocket for realtime collaborative editing of the document. The
        protocol is specified in docs/sync-protocol.md. Authenticate with an `Authorization` header
        on the upgrade request or with a ticket (`POST /auth/ws-ticket/`) in the first
        message (`hello`). Without either, the upgrade succeeds and the connection is
        closed with code 4001 if no valid ticket arrives within 10 seconds.
      operationId: documentWebsocket
      tags: [ Documents ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The Origin header is not in server.cors.allowedOrigins."
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's metadata"
      operationId: getResource
      tags: [ Resources ]
      responses:
        "200":
          description: "The resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a resource"
      description: |
        References to the resource are updated, like `POST /move/` with only `name`
        (docs/references.md section 5); use that endpoint with `dryRun` for a preview.
      operationId: renameResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a resource"
      operationId: deleteResource
      tags: [ Resources ]
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/content/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's content"
      operationId: getResourceContent
      tags: [ Resources ]
      responses:
        "200":
          description: "The file, with a content type derived from its name"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{sectionId}/{name}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
      - name: name
        in: path
        required: true
        description: "File name of the new resource"
        schema:
          type: string
    post:
      summary: "Upload a resource"
      description: "Uploads a file into the section. The content is the multipart field `file`."
      operationId: uploadResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "The new resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/references/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Outgoing references of a document"
      description: |
        The links, images, reference definitions and HTML references of the document that
        point to items of the wiki, in text order, resolved like MkDocs resolves them, or
        `broken`. External links and same-page anchors are left out. Open documents are read
        from their live text. See docs/references.md, sections 2 to 4.
      operationId: getDocumentReferences
      tags: [ References ]
      responses:
        "200":
          description: "The references"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentReferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/backlinks/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "References to a document (used by)"
      operationId: getDocumentBacklinks
      tags: [ References ]
      responses:
        "200":
          description: "The references to the document, sorted by source path, line and column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backlinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /section/{sectionId}/backlinks/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
    get:
      summary: "References to a section and everything inside it"
      description: |
        References to the section (folder links), its index document and every item inside it,
        recursively. `internal` marks references from documents inside the section.
      operationId: getSectionBacklinks
      tags: [ References ]
      responses:
        "200":
          description: "The references, sorted by source path, line and column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backlinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/backlinks/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "References to a resource (used by)"
      operationId: getResourceBacklinks
      tags: [ References ]
      responses:
        "200":
          description: "The references to the resource, sorted by source path, line and column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backlinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/thumbnail/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A thumbnail of an image resource"
      description: |
        JPEG, or PNG for images with transparency, whose longer side is at most `size` pixels.
        Works for PNG, JPEG, GIF (first frame) and WebP images up to 50 megapixels; the tree
        field `thumbnail` says which. Smaller images are not upscaled. JPEG orientation from
        EXIF is applied. Thumbnails are cached on the server.
      operationId: getResourceThumbnail
      tags: [ References ]
      parameters:
        - name: size
          in: query
          required: false
          description: "64 to 1024, rounded up to 64, 128, 256, 512 or 1024"
          schema:
            type: integer
            minimum: 64
            maximum: 1024
            default: 256
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: "The thumbnail"
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: "private, max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: "The ETag matches"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /references/broken/:
    get:
      summary: "All broken references of the wiki"
      operationId: getBrokenReferences
      tags: [ References ]
      responses:
        "200":
          description: "The broken references, sorted by source path, line and column"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokenReferences"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /references/unused-resources/:
    get:
      summary: "Resources that nothing uses"
      description: |
        Resources that no reference points to and whose path is no string value of `mkdocs.yml`
        (for example `theme.logo`). A hint for cleanup: templates, snippets and links from outside
        the wiki are not seen.
      operationId: getUnusedResources
      tags: [ References ]
      responses:
        "200":
          description: "The unused resources, sorted by path"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnusedResources"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /link/:
    get:
      summary: "The link destination from a document to an item"
      description: |
        The reference implementation of the link path algorithm (docs/references.md section 8),
        which the clients implement themselves for their pickers.
      operationId: getLink
      tags: [ References ]
      parameters:
        - name: from
          in: query
          required: true
          description: "Id of the document that will contain the link"
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: "Id of the target document, section or resource"
          schema:
            type: string
        - name: anchor
          in: query
          required: false
          description: "Heading anchor, without `#`"
          schema:
            type: string
      responses:
        "200":
          description: "The destination and a markdown snippet"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /move/:
    post:
      summary: "Move or rename an item and update every reference to it"
      description: |
        Moves a section (with everything in it), document or resource into another section,
        optionally with a new name, or renames it in place. References in all documents and the
        paths in `mkdocs.yml` (`nav`, `theme.logo`, `theme.favicon`, `extra_javascript`) are
        updated as Automerge changes, so connected clients receive them live and offline clients
        merge them later. With `dryRun` nothing changes and the answer lists what would. The move
        is atomic: it is validated first, and a failure undoes everything. With `git.enabled` it
        is one commit. Old ids keep working through redirects (`GET /moved/{id}/`, `details.movedTo`
        of a 404, `document-renamed` on the websocket). See docs/references.md sections 5 to 7.
      operationId: moveItem
      tags: [ References ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveRequest"
      responses:
        "200":
          description: "What changed (or would change with `dryRun`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveResult"
        "400":
          description: "Invalid move; `details.reason` is `invalid-name`, `blacklisted`, `into-itself`, `root`, `no-change` or `invalid-type`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The new path exists (`details.reason: exists`, `details.path`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Error"

  /moved/:
    get:
      summary: "Where several moved items are now"
      description: |
        `GET /moved/{itemId}/` for several ids in one request (docs/references.md section 7). An
        id that would answer 404 there has no element in `moved`. `features` of
        `GET /server-info/` contains `moved-lookup` on a server with this route.
      operationId: getMovedList
      tags: [ References ]
      parameters:
        - name: id
          in: query
          description: "The ids to look up, as a repeated parameter"
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items:
              type: string
      responses:
        "200":
          description: "The ids that moved, in the order of the request, without repeats"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovedList"
        "400":
          description: "More than 200 ids (`details.reason: too-many-ids`, `details.maxIds`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /moved/{itemId}/:
    parameters:
      - name: itemId
        in: path
        required: true
        description: "An old id of a moved item"
        schema:
          type: string
    get:
      summary: "Where a moved item is now"
      description: |
        Resolves an old id through the redirect table (docs/references.md section 7). An id that
        names an existing item, or an unknown id, answers 404.
      operationId: getMoved
      tags: [ References ]
      responses:
        "200":
          description: "The item now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moved"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /pins/:
    get:
      summary: "The family pins and the own pins"
      description: |
        Pins of documents that do not exist (deleted or moved outside the API) are left out; they
        come back with the document. `features` of `GET /server-info/` contains `pins`.
      operationId: getPins
      tags: [ Dashboard ]
      responses:
        "200":
          description: "Both lists, in their order"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pins"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pins/family/order/:
    put:
      summary: "Reorder the family pins"
      description: |
        Editors and admins. The listed documents come first, in this order; ids that are not
        pinned are ignored, and the other pins follow in their order. New pins go to the end.
        `features` of `GET /server-info/` contains `pin-order`.
      operationId: putFamilyPinOrder
      tags: [ Dashboard ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinOrder"
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /pins/personal/order/:
    put:
      summary: "Reorder the own pins"
      description: "Every account, readers too; like the family order otherwise."
      operationId: putPersonalPinOrder
      tags: [ Dashboard ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinOrder"
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /pins/family/{documentId}/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    put:
      summary: "Pin a document for everyone"
      description: "Editors and admins. Pinning a pinned document changes nothing."
      operationId: putFamilyPin
      tags: [ Dashboard ]
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Unpin a document for everyone"
      description: "Editors and admins. Unpinning a document that is not pinned changes nothing."
      operationId: deleteFamilyPin
      tags: [ Dashboard ]
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /pins/personal/{documentId}/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    put:
      summary: "Pin a document for yourself"
      description: "Every account, readers too. App tokens with the scope `read` get 403."
      operationId: putPersonalPin
      tags: [ Dashboard ]
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Unpin a document for yourself"
      operationId: deletePersonalPin
      tags: [ Dashboard ]
      responses:
        "200":
          $ref: "#/components/responses/Pins"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /feed/:
    get:
      summary: "What changed in the wiki"
      description: |
        Edits, created, moved and deleted documents and sections, newest first, for 365 days
        (docs/dashboard.md). `features` of `GET /server-info/` contains `feed`.
      operationId: getFeed
      tags: [ Dashboard ]
      parameters:
        - name: before
          in: query
          description: "`next` of the previous page; without it the page starts with the newest entry"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "One page of the feed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /push/subscriptions/:
    get:
      summary: "The push subscriptions of the own account"
      description: "404 `not-found` when push is off; `features` of `GET /server-info/` contains `push` when it is on."
      operationId: getPushSubscriptions
      tags: [ Push ]
      responses:
        "200":
          $ref: "#/components/responses/PushSubscriptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: "Subscribe to push messages"
      description: |
        The body has the format of a browser `PushSubscription` and of UnifiedPush. Posting an
        endpoint again replaces its keys and binds it to the current session, which may belong
        to another account. The subscription ends with the session. An account keeps at most
        10 subscriptions; a new one replaces the oldest. Every role may subscribe, app tokens may not.
      operationId: postPushSubscription
      tags: [ Push ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "200":
          $ref: "#/components/responses/PushSubscriptions"
        "400":
          description: "Invalid keys (`bad-request`), or an endpoint that is not https on an allowed host (`endpoint-not-allowed`, `details.allowedHosts`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Unsubscribe"
      description: "Removing an endpoint that is not subscribed changes nothing."
      operationId: deletePushSubscription
      tags: [ Push ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ endpoint ]
              properties:
                endpoint:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/PushSubscriptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: "__Host-mkdocseditor_session"
      description: "Session cookie of the web client (`mkdocseditor_session` over plain HTTP)"
    bearerAuth:
      type: http
      scheme: bearer
      description: "A session token (`mds_…`) of a native client"
    basicAuth:
      type: http
      scheme: basic
      description: "Username and app token; account passwords are not accepted"

  parameters:
    sectionId:
      name: sectionId
      in: path
      required: true
      description: "Id of a section (`root` for the root section)"
      schema:
        type: string
    documentId:
      name: documentId
      in: path
      required: true
      description: "Id of a document"
      schema:
        type: string
    revision:
      name: revision
      in: path
      required: true
      description: "Commit hash from the history, 7 to 64 hex characters"
      schema:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
    resourceId:
      name: resourceId
      in: path
      required: true
      description: "Id of a resource"
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      description: "Id of an account"
      schema:
        type: string
    deviceLinkId:
      name: deviceLinkId
      in: path
      required: true
      description: "Id of a device link"
      schema:
        type: string
    tokenId:
      name: tokenId
      in: path
      required: true
      description: "Id of an app token"
      schema:
        type: string
    passkeyId:
      name: passkeyId
      in: path
      required: true
      description: "Id of a passkey"
      schema:
        type: string
    sessionId:
      name: sessionId
      in: path
      required: true
      description: "Id of a session"
      schema:
        type: string
    linkId:
      name: linkId
      in: path
      required: true
      description: "Id of a link"
      schema:
        type: string
    linkStatus:
      name: status
      in: query
      required: false
      description: "Only links in this state"
      schema:
        type: string
        enum: [ pending, used, expired, revoked ]
    force:
      name: force
      in: query
      required: false
      description: "Delete even while clients are connected to an affected document"
      schema:
        type: boolean
        default: false

  responses:
    PushSubscriptions:
      description: "The subscriptions of the own account, newest first"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushSubscriptions"
    Pins:
      description: "The pins after the change, as `GET /pins/` answers"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Pins"
    TooManyRequests:
      description: "Rate limited; retry after the `Retry-After` header (seconds)"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: "Invalid request, for example a name with a slash or a leading dot"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Missing or invalid credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The user's role does not allow this"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No item with this id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "The target already exists, or clients are connected to the document"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Revision:
      description: "The change is applied (or changed nothing); the new revision"
      headers:
        ETag:
          description: "The revision in quotes"
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionResponse"
    ContentConflict:
      description: |
        `edit-not-found` or `edit-ambiguous` (an `old` of the edit at `details.index` occurs not
        or more than once), or `unknown-revision` (the document does not have the base
        revision any more: read it again). For `edit-not-found`, `details.hint` may name a
        near miss: a whitespace difference or the closest line.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "The request body is larger than 4 MiB (code `payload-too-large`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: "Unexpected error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Section:
      type: object
      required: [ type, id, name, subsections, documents, resources ]
      properties:
        type:
          type: string
          enum: [ section ]
        id:
          type: string
          example: "root"
        name:
          type: string
          description: "Folder name"
        path:
          type: string
          description: "Path relative to the docs folder, `\"\"` for the root section"
          example: "guide"
        index:
          type: string
          description: "Id of the index document (`index.md`, else `README.md`), or `\"\"`"
        subsections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    Document:
      type: object
      required: [ type, id, name, filesize, modtime, url ]
      properties:
        type:
          type: string
          enum: [ document ]
        id:
          type: string
          example: "5772684240079201105"
        name:
          type: string
          description: "File name without the .md extension"
        path:
          type: string
          description: "Path relative to the docs folder"
          example: "guide/setup.md"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time
        url:
          type: string
          description: "Path of the page relative to the site root, for example `guide/setup/`"
        title:
          type: string
          description: "The page name as MkDocs shows it: front matter `title`, else the first level-1 heading, else from the file name (docs/page-meta.md)"
        meta:
          $ref: "#/components/schemas/PageMeta"

    PageMeta:
      type: object
      description: "Fields of the YAML front matter; null or empty when the page does not set them"
      required: [ title, description, icon, status, tags, searchExclude, qr ]
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
          example: "material/rocket"
        status:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        searchExclude:
          type: boolean
          description: "`search: {exclude: true}`"
        qr:
          type: array
          description: "The valid QR code keys of the page, docs/qr.md"
          items:
            $ref: "#/components/schemas/QRKey"

    QRKey:
      type: object
      required: [ key, label ]
      properties:
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
          example: "waschmaschine"
        label:
          type: string
          nullable: true
          example: "Keller, an der Maschine"

    QRItem:
      type: object
      required: [ item, title ]
      properties:
        item:
          $ref: "#/components/schemas/ItemRef"
        title:
          type: string
          description: "The page title"

    QRCode:
      allOf:
        - $ref: "#/components/schemas/QRKey"
        - $ref: "#/components/schemas/QRItem"
        - type: object
          required: [ lastScannedAt ]
          properties:
            lastScannedAt:
              type: string
              format: date-time
              nullable: true

    QRGone:
      type: object
      required: [ key, label, lastPath, lastScannedAt ]
      properties:
        key:
          type: string
        label:
          type: string
          nullable: true
        lastPath:
          type: string
          description: "The last document that had the key"
        lastScannedAt:
          type: string
          format: date-time
          nullable: true

    QRCodes:
      type: object
      required: [ codes, conflicts, invalid, gone ]
      properties:
        codes:
          type: array
          items:
            $ref: "#/components/schemas/QRCode"
        conflicts:
          type: array
          items:
            type: object
            required: [ key, items, lastScannedAt ]
            properties:
              key:
                type: string
              items:
                type: array
                items:
                  $ref: "#/components/schemas/QRItem"
              lastScannedAt:
                type: string
                format: date-time
                nullable: true
        invalid:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/QRItem"
              - type: object
                required: [ value ]
                properties:
                  value:
                    type: string
                    description: "The qr value as written"
        gone:
          type: array
          items:
            $ref: "#/components/schemas/QRGone"

    WikiConfig:
      type: object
      required: [ siteName, siteUrl, useDirectoryUrls, theme, plugins, markdownExtensions, extraCss ]
      properties:
        siteName:
          type: string
        siteUrl:
          type: string
        useDirectoryUrls:
          type: boolean
        theme:
          type: object
          required: [ name, features, palette ]
          properties:
            name:
              type: string
            features:
              type: array
              items:
                type: string
            palette:
              type: array
              items:
                type: object
                additionalProperties: true
        plugins:
          type: array
          description: "In the order of mkdocs.yml; `search` alone without a `plugins` key"
          items:
            $ref: "#/components/schemas/WikiExtension"
        markdownExtensions:
          type: array
          items:
            $ref: "#/components/schemas/WikiExtension"
        extraCss:
          type: array
          items:
            type: string

    WikiExtension:
      type: object
      required: [ name, options ]
      properties:
        name:
          type: string
        options:
          type: object
          additionalProperties: true
          description: "The options from mkdocs.yml without secrets"

    Resource:
      type: object
      required: [ type, id, name, filesize, modtime ]
      properties:
        type:
          type: string
          enum: [ resource ]
        id:
          type: string
        name:
          type: string
          description: "File name"
        path:
          type: string
          description: "Path relative to the docs folder"
          example: "guide/img/logo.png"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time
        mimeType:
          type: string
          description: "From the file extension, `application/octet-stream` when unknown"
          example: "image/png"
        kind:
          type: string
          enum: [ image, video, audio, pdf, text, archive, other ]
        thumbnail:
          type: boolean
          description: "True when `GET /resource/{resourceId}/thumbnail/` works for the resource (PNG, JPEG, GIF and WebP)"

    ItemRef:
      type: object
      required: [ type, id, path, name ]
      properties:
        type:
          type: string
          enum: [ section, document, resource ]
        id:
          type: string
        path:
          type: string
          example: "guide/setup.md"
        name:
          type: string

    Reference:
      type: object
      required: [ kind, line, column, destination, anchor, status, target ]
      properties:
        kind:
          type: string
          enum: [ link, image, definition, html ]
        line:
          type: integer
          description: "1-based"
        column:
          type: integer
          description: "1-based, in Unicode code points, of the first character of the destination"
        destination:
          type: string
          description: "As written, including `?query` and `#anchor`"
          example: "../img/Strand%20(2).png"
        anchor:
          type: string
          description: "The part after `#`, or `\"\"`"
        status:
          type: string
          enum: [ ok, broken ]
        target:
          type: object
          allOf:
            - $ref: "#/components/schemas/ItemRef"
          nullable: true
          description: "The resolved item; null when broken"
        reason:
          type: string
          enum: [ not-found, outside-docs ]
          description: "Only for broken references"
        path:
          type: string
          description: "Only for broken references: the resolved path that does not exist"
        movedTo:
          $ref: "#/components/schemas/ItemRef"
        suggestedDestination:
          type: string
          description: "Only with `movedTo`: the destination that points to the moved item, in the style of the old one"
          example: "../Handbuch/setup.md#install"

    DocumentReferences:
      type: object
      required: [ document, references ]
      properties:
        document:
          $ref: "#/components/schemas/ItemRef"
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"

    Backlink:
      type: object
      required: [ source, kind, line, column, destination, anchor, target, internal ]
      properties:
        source:
          $ref: "#/components/schemas/ItemRef"
        kind:
          type: string
          enum: [ link, image, definition, html ]
        line:
          type: integer
        column:
          type: integer
        destination:
          type: string
        anchor:
          type: string
        target:
          $ref: "#/components/schemas/ItemRef"
        internal:
          type: boolean
          description: "Section backlinks only: the source document is inside the section"

    Backlinks:
      type: object
      required: [ item, backlinks ]
      properties:
        item:
          $ref: "#/components/schemas/ItemRef"
        backlinks:
          type: array
          items:
            $ref: "#/components/schemas/Backlink"

    BrokenReference:
      allOf:
        - $ref: "#/components/schemas/Reference"
        - type: object
          required: [ source ]
          properties:
            source:
              $ref: "#/components/schemas/ItemRef"

    BrokenReferences:
      type: object
      required: [ broken ]
      properties:
        broken:
          type: array
          items:
            $ref: "#/components/schemas/BrokenReference"

    UnusedResources:
      type: object
      required: [ resources ]
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    LinkResult:
      type: object
      required: [ destination, markdown, target ]
      properties:
        destination:
          type: string
          example: "../img/Strand%20%282%29.png"
        markdown:
          type: string
          example: "![Strand (2)](../img/Strand%20%282%29.png)"
        target:
          $ref: "#/components/schemas/ItemRef"

    MoveRequest:
      type: object
      required: [ type, id ]
      properties:
        type:
          type: string
          enum: [ section, document, resource ]
        id:
          type: string
        parent:
          type: string
          description: "Id of the target section; leave it out to rename in place"
        name:
          type: string
          description: "New name (documents without `.md`); leave it out to keep the name"
        dryRun:
          type: boolean
          default: false
        updateReferences:
          type: boolean
          default: true
          description: "With false only the item moves; references stay as they are"

    MovedItem:
      type: object
      required: [ type, oldId, newId, oldPath, newPath ]
      properties:
        type:
          type: string
          enum: [ section, document, resource ]
        oldId:
          type: string
        newId:
          type: string
        oldPath:
          type: string
        newPath:
          type: string

    LineEdit:
      type: object
      required: [ line, before, after ]
      properties:
        line:
          type: integer
          description: "1-based line number in the text before the move"
        before:
          type: string
        after:
          type: string

    MoveResult:
      type: object
      required: [ dryRun, type, oldId, newId, oldPath, newPath, moved, documents, config ]
      properties:
        dryRun:
          type: boolean
        type:
          type: string
          enum: [ section, document, resource ]
        oldId:
          type: string
        newId:
          type: string
        oldPath:
          type: string
        newPath:
          type: string
        item:
          type: object
          description: "The section, document or resource after the move (absent in a dry run)"
        moved:
          type: array
          description: "Every item whose id changes, sorted by old path"
          items:
            $ref: "#/components/schemas/MovedItem"
        documents:
          type: array
          description: "Every document whose text changes, sorted by new path"
          items:
            type: object
            required: [ documentId, newDocumentId, path, newPath, edits ]
            properties:
              documentId:
                type: string
              newDocumentId:
                type: string
              path:
                type: string
              newPath:
                type: string
              edits:
                type: array
                items:
                  $ref: "#/components/schemas/LineEdit"
        config:
          type: array
          description: "Changed lines of mkdocs.yml"
          items:
            type: object
            required: [ file, line, before, after ]
            properties:
              file:
                type: string
                example: "mkdocs.yml"
              line:
                type: integer
              before:
                type: string
              after:
                type: string
        commit:
          type: string
          description: "Abbreviated git commit hash (with git.enabled, not in a dry run)"

    Moved:
      type: object
      required: [ oldId, type, item, movedAt ]
      properties:
        oldId:
          type: string
        type:
          type: string
          enum: [ section, document, resource ]
        item:
          $ref: "#/components/schemas/ItemRef"
        movedAt:
          type: string
          format: date-time

    MovedList:
      type: object
      required: [ moved ]
      properties:
        moved:
          type: array
          items:
            $ref: "#/components/schemas/Moved"

    NewItemRequest:
      type: object
      required: [ parent, name ]
      properties:
        parent:
          type: string
          description: "Id of the parent section"
        name:
          type: string
          description: "Name of the new section, or of the document without .md"

    RenameRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: "New name (for documents without .md)"

    User:
      type: object
      required: [ id, username, displayName, role, color, avatar ]
      properties:
        id:
          type: string
          description: "Stable account id (`anonymous` when authentication is off)"
        username:
          type: string
          description: "Current username; it can change, the id does not"
        displayName:
          type: string
        role:
          type: string
          enum: [ admin, editor, reader ]
        color:
          type: string
          example: "#1971c2"
        avatar:
          type: string
          nullable: true
          description: "Version of the profile picture, at `/avatars/{id}/{avatar}/`; null without one"
          example: "3f9a1c0b7d2e4a68"

    WhoAmI:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ authMethod, secondFactorSetupRequired ]
          properties:
            authMethod:
              type: string
              enum: [ session, app-token, anonymous ]
            secondFactorSetupRequired:
              type: boolean
              description: "The instance requires 2FA and this account has none yet: only the 2FA setup endpoints work"
            sessionId:
              type: string

    UserWithSetupState:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ secondFactorSetupRequired, passkeyCount ]
          properties:
            secondFactorSetupRequired:
              type: boolean
            passkeyCount:
              type: integer
              description: "Number of passkeys of the account, to offer a passkey right after sign-in"

    AuthStatus:
      type: object
      required: [ setupRequired, authDisabled, passkeys, passwordPolicy ]
      properties:
        setupRequired:
          type: boolean
          description: "No account exists; the first admin is created with a setup link"
        authDisabled:
          type: boolean
        passkeys:
          type: object
          required: [ enabled ]
          properties:
            enabled:
              type: boolean
            rpId:
              type: string
        passwordPolicy:
          type: object
          required: [ minLength, maxLength ]
          properties:
            minLength:
              type: integer
            maxLength:
              type: integer

    SessionFields:
      type: object
      properties:
        sessionType:
          type: string
          enum: [ cookie, bearer ]
          default: cookie
          description: "`cookie` sets the HttpOnly session cookie, `bearer` returns the token"
        deviceName:
          type: string
          maxLength: 64

    LoginRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ username, password ]
          properties:
            username:
              type: string
            password:
              type: string
              format: password

    LinkTokenRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
          description: "The link token (`mdl_…`) from the link fragment"

    LinkRedeemRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ token, password ]
          properties:
            token:
              type: string
            username:
              type: string
              description: "Setup and invite links only"
            displayName:
              type: string
              description: "Setup and invite links only, defaults to the username"
            password:
              type: string
              format: password

    LinkInspection:
      type: object
      required: [ kind, expiresAt ]
      properties:
        kind:
          type: string
          enum: [ setup, invite, reset ]
        role:
          type: string
          enum: [ admin, editor, reader ]
        note:
          type: string
        username:
          type: string
          description: "Reset links: the account"
        displayName:
          type: string
        resetSecondFactors:
          type: boolean
        expiresAt:
          type: string
          format: date-time

    Session:
      type: object
      required: [ id, type, deviceName, userAgent, ip, createdAt, lastUsedAt, expiresAt, idleExpiresAt, current ]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ cookie, bearer ]
        deviceName:
          type: string
        userAgent:
          type: string
        ip:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: "Absolute expiry"
        idleExpiresAt:
          type: string
          format: date-time
          description: "Expiry if the session is not used"
        current:
          type: boolean

    SessionResponse:
      type: object
      required: [ status, user, session ]
      properties:
        status:
          type: string
          enum: [ ok ]
        user:
          $ref: "#/components/schemas/UserWithSetupState"
        session:
          $ref: "#/components/schemas/Session"
        token:
          type: string
          description: "Bearer sessions only: the session token (`mds_…`)"

    SecondFactorRequired:
      type: object
      required: [ status, challenge, methods, expiresAt ]
      properties:
        status:
          type: string
          enum: [ second-factor-required ]
        challenge:
          type: string
          description: "Login challenge (`mdc_…`), valid 5 minutes and 5 attempts"
        methods:
          type: array
          items:
            type: string
            enum: [ totp, recovery-code, passkey ]
        expiresAt:
          type: string
          format: date-time

    SecondFactorRequest:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ challenge ]
          description: "Exactly one of `code` and `recoveryCode`"
          properties:
            challenge:
              type: string
            code:
              type: string
              example: "123456"
            recoveryCode:
              type: string
              example: "abcd-efgh-jkmn"

    ReauthRequest:
      type: object
      properties:
        password:
          type: string
          format: password
        code:
          type: string

    Reauthenticated:
      type: object
      required: [ reauthenticatedUntil ]
      properties:
        reauthenticatedUntil:
          type: string
          format: date-time

    Account:
      allOf:
        - $ref: "#/components/schemas/UserWithSetupState"
        - type: object
          required: [ email, createdAt, hasPassword, totpEnabled, recoveryCodesLeft, passkeyCount, require2FA, reauthenticatedUntil ]
          properties:
            email:
              type: string
            createdAt:
              type: string
              format: date-time
            hasPassword:
              type: boolean
            totpEnabled:
              type: boolean
            recoveryCodesLeft:
              type: integer
            passkeyCount:
              type: integer
            require2FA:
              type: boolean
            reauthenticatedUntil:
              type: string
              format: date-time
              nullable: true
              description: "End of the step-up window, null when it has passed"

    AccountUpdate:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
          maxLength: 64
        color:
          type: string
          example: "#1971c2"
        email:
          type: string
          description: "An empty string removes the email"

    PasswordChange:
      type: object
      required: [ newPassword ]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    TOTPEnrollment:
      type: object
      required: [ secret, otpauthUri, expiresAt ]
      properties:
        secret:
          type: string
          description: "Base32, for manual entry"
        otpauthUri:
          type: string
          example: "otpauth://totp/MkDocsEditor:markus?secret=JBSWY3DPEHPK3PXP&issuer=MkDocsEditor&algorithm=SHA1&digits=6&period=30"
        expiresAt:
          type: string
          format: date-time

    TOTPConfirm:
      type: object
      required: [ code ]
      properties:
        code:
          type: string

    RecoveryCodes:
      type: object
      required: [ recoveryCodes ]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            example: "abcd-efgh-jkmn"

    EmptyObject:
      type: object

    Ceremony:
      type: object
      required: [ ceremonyId, publicKey ]
      properties:
        ceremonyId:
          type: string
          description: "Valid 5 minutes, single use"
        publicKey:
          type: object
          additionalProperties: true
          description: "PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON (binary fields base64url)"

    WebAuthnCredential:
      type: object
      additionalProperties: true
      description: "The standard JSON of a PublicKeyCredential (RegistrationResponseJSON or AuthenticationResponseJSON)"
      required: [ id, rawId, type, response ]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [ public-key ]
        response:
          type: object
          additionalProperties: true

    PasskeyLoginBegin:
      type: object
      properties:
        challenge:
          type: string
          description: "The challenge of a password login (passkey as second factor)"

    PasskeyLoginFinish:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ ceremonyId, credential ]
          properties:
            ceremonyId:
              type: string
            credential:
              $ref: "#/components/schemas/WebAuthnCredential"

    LinkPasskeyBegin:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
        username:
          type: string
          description: "Setup and invite links only"
        displayName:
          type: string

    LinkPasskeyFinish:
      allOf:
        - $ref: "#/components/schemas/SessionFields"
        - type: object
          required: [ ceremonyId, credential ]
          properties:
            ceremonyId:
              type: string
            credential:
              $ref: "#/components/schemas/WebAuthnCredential"
            passkeyName:
              type: string
              maxLength: 64

    PasskeyFinish:
      type: object
      required: [ ceremonyId, credential ]
      properties:
        ceremonyId:
          type: string
        credential:
          $ref: "#/components/schemas/WebAuthnCredential"
        name:
          type: string
          maxLength: 64
          description: "Default: the provider name (from the AAGUID) or Passkey"

    PasskeyRename:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 64

    Passkey:
      type: object
      required: [ id, name, createdAt, lastUsedAt, backedUp, transports ]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        backedUp:
          type: boolean
          description: "Synced passkey (backup state flag)"
        transports:
          type: array
          items:
            type: string
        provider:
          type: string
          description: "Known passkey provider of the AAGUID, for example Bitwarden"

    ServerInfo:
      type: object
      required: [ name, version, protocolVersion, backendUrl, wikiUrl, webClientUrl, setupRequired, authDisabled, passkeys, loginMethods, require2FA, features, push ]
      properties:
        name:
          type: string
          description: "server.instanceName, else the host of wikiUrl, webClientUrl or the request"
        version:
          type: string
          description: "Backend build version (dev for local builds)"
        protocolVersion:
          type: integer
          description: "Sync protocol version (docs/sync-protocol.md)"
        backendUrl:
          type: string
          nullable: true
        wikiUrl:
          type: string
          nullable: true
        webClientUrl:
          type: string
          nullable: true
        setupRequired:
          type: boolean
        authDisabled:
          type: boolean
        passkeys:
          type: object
          required: [ enabled ]
          properties:
            enabled:
              type: boolean
            rpId:
              type: string
        loginMethods:
          type: array
          items:
            type: string
            enum: [ password, passkey, device-link ]
        require2FA:
          type: boolean
        features:
          type: array
          description: "Optional API features of this server. Clients ignore names they do not know."
          items:
            type: string
        push:
          type: object
          nullable: true
          description: "Set when the server sends Web Push messages (docs/push.md)"
          required: [ vapidPublicKey ]
          properties:
            vapidPublicKey:
              type: string
              description: "VAPID public key: the uncompressed P-256 point, base64url without padding"

    DeviceLink:
      type: object
      required: [ id, deviceName, createdAt, expiresAt, status, redeemedAt, redeemedDeviceName, sessionId ]
      properties:
        id:
          type: string
        deviceName:
          type: string
          nullable: true
          description: "Hint from the creator"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ pending, redeemed, expired, revoked ]
        redeemedAt:
          type: string
          format: date-time
          nullable: true
        redeemedDeviceName:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
          description: "The session created by the redeem"

    DeviceLinkRequest:
      type: object
      properties:
        deviceName:
          type: string
          maxLength: 64

    CreatedDeviceLink:
      type: object
      required: [ deviceLink, token, expiresAt, connectUrl ]
      properties:
        deviceLink:
          $ref: "#/components/schemas/DeviceLink"
        token:
          type: string
          description: "mdd_..., returned only once"
        expiresAt:
          type: string
          format: date-time
        connectUrl:
          type: string
          nullable: true
          description: "{clientUrl}/connect#<payload>; null without server.auth.clientUrl"

    DeviceLinkRedeemRequest:
      type: object
      required: [ token ]
      properties:
        token:
          type: string
        username:
          type: string
          description: "Optional; must match the account when sent"
        sessionType:
          type: string
          enum: [ cookie, bearer ]
          default: bearer
        deviceName:
          type: string
          maxLength: 64

    AppToken:
      type: object
      required: [ id, name, scope, createdAt, lastUsedAt, expiresAt, slidingExpiry ]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum: [ read, write ]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        oauthClientId:
          type: string
          description: "The OAuth client of a grant (docs/oauth.md); absent for tokens made by hand"
        resource:
          type: string
          description: "The only resource an OAuth grant may use (the MCP endpoint)"
        slidingExpiry:
          type: boolean
          description: |
            True for OAuth grants without a fixed end: they live while they are used, and
            `expiresAt` moves 30 days ahead with every refresh. False for app tokens and for
            grants that end at `expiresAt`.

    ProtectedResourceMetadata:
      type: object
      required: [ resource, authorization_servers, scopes_supported, bearer_methods_supported ]
      properties:
        resource:
          type: string
          description: "The MCP endpoint, `<backendUrl>/mcp`"
        authorization_servers:
          type: array
          items: { type: string }
        scopes_supported:
          type: array
          items: { type: string }
        bearer_methods_supported:
          type: array
          items: { type: string }
        resource_name:
          type: string

    AuthServerMetadata:
      type: object
      required: [ issuer, authorization_endpoint, token_endpoint, registration_endpoint, code_challenge_methods_supported ]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        revocation_endpoint: { type: string }
        scopes_supported: { type: array, items: { type: string } }
        response_types_supported: { type: array, items: { type: string } }
        response_modes_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        revocation_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        client_id_metadata_document_supported:
          type: boolean
          description: "Always false: clients register (RFC 7591)"

    OAuthClientMetadata:
      type: object
      required: [ redirect_uris ]
      properties:
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string }
        client_name:
          type: string
          maxLength: 100
          description: "The name of the app token of the grant (default `MCP client`)"
        grant_types:
          type: array
          items: { type: string, enum: [ authorization_code, refresh_token ] }
        response_types:
          type: array
          items: { type: string, enum: [ code ] }

    OAuthClient:
      type: object
      required: [ client_id, client_id_issued_at, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method ]
      properties:
        client_id: { type: string }
        client_id_issued_at: { type: integer, format: int64 }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string, enum: [ none ] }
        scope: { type: string }

    OAuthTokenResponse:
      type: object
      required: [ access_token, token_type, expires_in, refresh_token, scope ]
      properties:
        access_token: { type: string, description: "`mdo_…`, valid for an hour at /mcp only" }
        token_type: { type: string, enum: [ Bearer ] }
        expires_in: { type: integer }
        refresh_token: { type: string, description: "`mdr_…`, valid for 30 days, rotates" }
        scope: { type: string, enum: [ read, read write ] }

    OAuthError:
      type: object
      required: [ error ]
      properties:
        error: { type: string }
        error_description: { type: string }

    OAuthRequest:
      type: object
      required: [ id, clientId, clientName, redirectUri, scope, allowedScopes, resource, expiresAt, defaults ]
      properties:
        id: { type: string }
        clientId: { type: string }
        clientName:
          type: string
          description: "Chosen by the client itself: show it as a claim, together with the redirect URI"
        redirectUri: { type: string }
        scope:
          type: string
          enum: [ read, write ]
          description: "The requested scope"
        allowedScopes:
          type: array
          items: { type: string, enum: [ read, write ] }
          description: "What the user may grant: readers only read"
        resource: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: "When the request ends (10 minutes), not the grant"
        defaults:
          type: object
          required: [ name, expiresAt, maxExpiresAt ]
          description: "What the grant gets without a choice, to prefill the consent page"
          properties:
            name:
              type: string
              description: "The client's name, cut to 64 characters"
            expiresAt:
              type: string
              format: date-time
              nullable: true
              description: "Always null: no fixed end, the grant lives while it is used (30 days after the last refresh)"
            maxExpiresAt:
              type: string
              format: date-time
              description: "The latest end an approval may set"

    OAuthDecisionRequest:
      type: object
      properties:
        scope:
          type: string
          enum: [ read, write ]
          description: "Absent: the requested scope. `read` lowers it."
        name:
          type: string
          maxLength: 64
          description: "Name of the grant, 1 to 64 characters. Absent or empty: the client's name."
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Fixed end of the grant (RFC 3339 date-time; a date alone is 400), in the future and
            at most 3650 days ahead. Refreshes never extend it, and no token outlives it.
            Absent or null: no fixed end. The end never changes later.

    OAuthDecision:
      type: object
      required: [ redirectUrl ]
      properties:
        redirectUrl:
          type: string
          description: "Send the browser there (location.assign)"

    AppTokenRequest:
      type: object
      required: [ name, scope ]
      properties:
        name:
          type: string
          maxLength: 64
        scope:
          type: string
          enum: [ read, write ]
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: "Absent: no expiry"
        expiresAt:
          type: string
          format: date-time
          description: "Absolute end instead of expiresInDays (not both): in the future, at most 3650 days ahead"

    AppTokenUpdateRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64

    CreatedAppToken:
      type: object
      required: [ appToken, token ]
      properties:
        appToken:
          $ref: "#/components/schemas/AppToken"
        token:
          type: string
          description: "mdp_..., returned only once"

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [ email, status, createdAt, lastLoginAt, hasPassword, totpEnabled, passkeyCount, sessionCount ]
          properties:
            email:
              type: string
            status:
              type: string
              enum: [ active, disabled, deleted ]
            createdAt:
              type: string
              format: date-time
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            hasPassword:
              type: boolean
            totpEnabled:
              type: boolean
            passkeyCount:
              type: integer
            sessionCount:
              type: integer

    AdminUserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [ admin, editor, reader ]
        status:
          type: string
          enum: [ active, disabled ]
        username:
          type: string
        displayName:
          type: string
        color:
          type: string
        email:
          type: string

    ResetLinkRequest:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: "Default 60"
        resetSecondFactors:
          type: boolean
          description: "Remove TOTP, recovery codes and passkeys when the link is redeemed"

    InstanceSettings:
      type: object
      properties:
        require2FA:
          type: boolean
        accessRequestsEnabled:
          type: boolean
          description: "People without an account may ask for an invite"

    CreateAccessRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 80
          description: "Who is asking. Only a claim, and untrusted plain text."
        message:
          type: string
          maxLength: 500
          description: "Untrusted plain text"
        documentId:
          type: string
          maxLength: 128
          description: "The document of the join link"
        invitedBy:
          type: string
          maxLength: 128
          description: "The account id of the join link"

    CreatedAccessRequest:
      type: object
      required: [ requestId, token, status, expiresAt ]
      properties:
        requestId:
          type: string
        token:
          type: string
          description: "`mda_…`, shown only once"
        status:
          type: string
          enum: [ pending ]
        expiresAt:
          type: string
          format: date-time

    AccessRequestStatus:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ pending, approved, rejected, expired ]
        inviteToken:
          type: string
          description: "`mdl_…`, only while the request is approved and the invite is unredeemed"

    AccessRequest:
      type: object
      required: [ id, name, message, status, createdAt, expiresAt, documentId, documentPath, invitedByAccountId, invitedByName ]
      properties:
        id:
          type: string
        name:
          type: string
          description: "Only a claim, and untrusted plain text"
        message:
          type: string
          description: "Untrusted plain text"
        status:
          type: string
          enum: [ pending, approved, rejected, expired ]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        documentId:
          type: string
          nullable: true
        documentPath:
          type: string
          nullable: true
        invitedByAccountId:
          type: string
          nullable: true
        invitedByName:
          type: string
          nullable: true

    ApproveAccessRequest:
      type: object
      required: [ role ]
      properties:
        role:
          type: string
          enum: [ admin, editor, reader ]
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720

    ApprovedAccessRequest:
      type: object
      required: [ request, invite, token, url ]
      properties:
        request:
          $ref: "#/components/schemas/AccessRequest"
        invite:
          $ref: "#/components/schemas/Link"
        token:
          type: string
        url:
          type: string
          nullable: true

    AuditEvent:
      type: object
      required: [ id, time, type, actor, target, ip, userAgent, details ]
      properties:
        id:
          type: integer
        time:
          type: string
          format: date-time
        type:
          type: string
        actor:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        target:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        ip:
          type: string
        userAgent:
          type: string
        details:
          type: object
          additionalProperties: true

    AuditPage:
      type: object
      required: [ events, next ]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next:
          type: integer
          nullable: true

    Revoked:
      type: object
      required: [ revoked ]
      properties:
        revoked:
          type: integer

    Link:
      type: object
      required: [ id, kind, note, accountId, resetSecondFactors, createdBy, createdAt, expiresAt, usedAt, usedBy, revokedAt, status ]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [ setup, invite, reset ]
        role:
          type: string
          enum: [ admin, editor, reader ]
        note:
          type: string
        accountId:
          type: string
          nullable: true
        resetSecondFactors:
          type: boolean
        createdBy:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        usedBy:
          type: object
          nullable: true
          required: [ id ]
          properties:
            id:
              type: string
            username:
              type: string
        revokedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ pending, used, expired, revoked ]

    CreateInviteRequest:
      type: object
      required: [ role ]
      properties:
        role:
          type: string
          enum: [ admin, editor, reader ]
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          description: "Default 168 (7 days)"
        note:
          type: string
          maxLength: 200

    CreatedLink:
      type: object
      required: [ token, url ]
      properties:
        invite:
          $ref: "#/components/schemas/Link"
        link:
          $ref: "#/components/schemas/Link"
        token:
          type: string
          description: "The link token, returned only once"
        url:
          type: string
          nullable: true
          description: "`{clientUrl}/{kind}#{token}`, null without `server.auth.clientUrl`"

    Ticket:
      type: object
      required: [ ticket, expiresAt ]
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time

    PushSubscriptionRequest:
      type: object
      required: [ endpoint, keys ]
      properties:
        endpoint:
          type: string
          description: "https URL of the push service, on a host of server.push.allowedHosts"
        keys:
          type: object
          required: [ p256dh, auth ]
          properties:
            p256dh:
              type: string
              description: "Uncompressed P-256 public key of the client, base64url"
            auth:
              type: string
              description: "16 byte authentication secret, base64url"

    PushSubscriptions:
      type: object
      required: [ subscriptions ]
      properties:
        subscriptions:
          type: array
          items:
            type: object
            required: [ endpoint, createdAt, lastPushAt, current ]
            properties:
              endpoint:
                type: string
              createdAt:
                type: string
                format: date-time
              lastPushAt:
                type: string
                format: date-time
                nullable: true
                description: "The last push the push service accepted"
              current:
                type: boolean
                description: "The subscription of the requesting session"

    Author:
      type: object
      required: [ displayName, color, avatar ]
      description: "An account as it is now, or the server: `External change` for changes of the files, `Server` for the backend itself"
      properties:
        accountId:
          type: string
          description: "Missing for the server"
        username:
          type: string
          description: "Missing for the server"
        displayName:
          type: string
        color:
          type: string
        avatar:
          type: string
          nullable: true
          description: "Version of the profile picture, at `/avatars/{accountId}/{avatar}/`; null for the server and without one"

    Pin:
      type: object
      required: [ documentId, path, name, title, pinnedBy, pinnedAt ]
      properties:
        documentId:
          type: string
        path:
          type: string
          description: "Path relative to the docs folder"
        name:
          type: string
        title:
          type: string
          description: "The page name, see `Document.title`"
        pinnedBy:
          $ref: "#/components/schemas/Author"
        pinnedAt:
          type: string
          format: date-time

    PinOrder:
      type: object
      required: [ documentIds ]
      properties:
        documentIds:
          type: array
          description: "Document ids in the new order"
          items:
            type: string

    Pins:
      type: object
      required: [ family, personal ]
      properties:
        family:
          type: array
          description: "Pinned for everyone, in their order"
          items:
            $ref: "#/components/schemas/Pin"
        personal:
          type: array
          description: "Pinned by the requesting account for itself, in their order"
          items:
            $ref: "#/components/schemas/Pin"

    FeedEntry:
      type: object
      required: [ id, time, kind, itemType, title, path, authors ]
      properties:
        id:
          type: string
        time:
          type: string
          format: date-time
          description: "The last change of the entry; an edit entry moves up while its editing session goes on"
        kind:
          type: string
          enum: [ edited, created, moved, deleted ]
        itemType:
          type: string
          enum: [ document, section ]
        documentId:
          type: string
          description: "The current id of the document, if one exists at `path`"
        title:
          type: string
          nullable: true
          description: "The page name of the document at `path`, null if there is none"
        path:
          type: string
          description: "Path relative to the docs folder; for moves the new path"
        oldPath:
          type: string
          description: "Only for `moved`"
        authors:
          type: array
          description: "In the order of their first change"
          items:
            $ref: "#/components/schemas/Author"
        summary:
          $ref: "#/components/schemas/FeedSummary"

    FeedSummary:
      type: object
      description: "Only for `edited`: the change since the start of the editing session"
      required: [ linesAdded, linesRemoved, headings ]
      properties:
        linesAdded:
          type: integer
        linesRemoved:
          type: integer
        headings:
          type: array
          description: "Up to 5 headings above the changed lines, in document order"
          items:
            type: string
        textHash:
          type: string
          description: |
            First 16 hex digits of SHA-256 over the text after the last edit (feature
            `feed-ranges`, docs/dashboard.md). Missing on older entries.
          example: "9f2c1a0b7d3e4f55"
        ranges:
          type: array
          nullable: true
          description: |
            The changed lines in text order, at most 20 (feature `feed-ranges`). `null` on
            older entries.
          items:
            $ref: "#/components/schemas/FeedRange"

    FeedRange:
      type: object
      required: [ line, count, heading, headingOccurrence, offset ]
      properties:
        line:
          type: integer
          description: "1-based line of the text after the edit"
        count:
          type: integer
          description: "Added or changed lines from `line`; 0 marks lines removed before `line`"
        heading:
          type: string
          nullable: true
          description: "The nearest heading at or above `line`, as in `headings`"
        headingOccurrence:
          type: integer
          description: "Which heading with this text, 1 for the first; 0 without heading"
        offset:
          type: integer
          description: "`line` minus the line of the heading, or `line - 1` without heading"

    Feed:
      type: object
      required: [ entries, next ]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FeedEntry"
        next:
          type: string
          nullable: true
          description: "Cursor of the next page, null on the last page"

    Actor:
      type: object
      required: [ actorId, username, displayName, color, avatar ]
      properties:
        actorId:
          type: string
          description: "Automerge actor id, hex"
        accountId:
          type: string
          description: "Account the actor is bound to, empty for `:disk` / `:server`"
        username:
          type: string
          description: "Current username of the account, or `:disk` / `:server` for changes made by the server"
        displayName:
          type: string
        color:
          type: string
        avatar:
          type: string
          nullable: true
          description: "Version of the profile picture of the account, null for pseudo users and without one"
        agent:
          $ref: "#/components/schemas/AgentInfo"

    AgentInfo:
      type: object
      description: |
        Set for the actors of changes an account made with an app token (an agent, such as
        an LLM). Missing for everything else.
      required: [ tokenId, name ]
      properties:
        tokenId:
          type: string
          description: "Id of the app token; the token may be revoked since"
        name:
          type: string
          description: "Name of the app token when the actor was created"

    EditRequest:
      type: object
      required: [ edits ]
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/TextEdit"
        baseRevision:
          type: string
          description: "Revision the edits refer to (the ETag of the content); default: the current text"

    TextEdit:
      type: object
      required: [ old, new ]
      properties:
        old:
          type: string
          description: "Text to replace, must occur exactly once. Empty only in an empty document."
        new:
          type: string
          description: "Replacement"

    WriteContentRequest:
      type: object
      required: [ content, baseRevision ]
      properties:
        content:
          type: string
          description: "The full new markdown text"
        baseRevision:
          type: string
          description: "Revision the content was based on (the ETag of the content)"

    RevisionResponse:
      type: object
      required: [ revision ]
      properties:
        revision:
          type: string
          description: "Automerge heads (hex), sorted and joined with dots"

    SearchResponse:
      type: object
      required: [ results, total ]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer
          description: "Number of matching documents, also those beyond the limit"

    SearchResult:
      type: object
      required: [ id, path, title, snippets ]
      properties:
        id:
          type: string
        path:
          type: string
          description: "Path relative to the docs folder"
        title:
          type: string
        snippets:
          type: array
          description: "Up to three lines with a match, shortened around it"
          items:
            type: object
            required: [ line, text ]
            properties:
              line:
                type: integer
                description: "Line number, starting at 1"
              text:
                type: string

    Authorship:
      type: object
      required: [ heads, runs ]
      properties:
        heads:
          type: array
          description: "Automerge heads (hex) of the text the runs describe"
          items:
            type: string
        runs:
          type: array
          description: "Consecutive runs covering the whole text, in order"
          items:
            $ref: "#/components/schemas/AuthorshipRun"

    AuthorshipRun:
      type: object
      required: [ start, end, actorId, username ]
      properties:
        start:
          type: integer
          description: "First code point of the run"
        end:
          type: integer
          description: "Code point after the run"
        actorId:
          type: string
        accountId:
          type: string
          description: "Account of the actor, empty for server changes or if unknown"
        username:
          type: string
          description: "Current username of the account, `:disk` / `:server` for server changes, empty if unknown"

    HistoryEntry:
      type: object
      required: [ revision, time, author, coAuthors, message, path, appTokens, agents, summary ]
      properties:
        revision:
          type: string
          description: "Commit hash"
        time:
          type: string
          format: date-time
          description: "Author time"
        author:
          $ref: "#/components/schemas/HistoryAuthor"
        coAuthors:
          type: array
          description: "From the Co-authored-by trailers"
          items:
            $ref: "#/components/schemas/HistoryAuthor"
        message:
          type: string
          description: "Commit subject"
        path:
          type: string
          description: "Path of the file in this commit, relative to the docs folder"
        appTokens:
          type: array
          description: |
            Names of the app tokens (agents) changes of this commit were made with, from the
            `Via-App-Token` trailers
          items:
            type: string
        agents:
          type: array
          description: "The same app tokens with the account that used each"
          items:
            type: object
            required: [ name, accountId ]
            properties:
              name:
                type: string
              accountId:
                type: string
                description: "Empty if the account is unknown"
        summary:
          type: object
          required: [ linesAdded, linesRemoved, headings ]
          description: "What the commit changed, compared with the text before it"
          properties:
            linesAdded:
              type: integer
            linesRemoved:
              type: integer
            headings:
              type: array
              description: "Headings above the changed lines, at most 5, in document order"
              items:
                type: string

    HistoryDiff:
      type: object
      required: [ from, to, hunks ]
      properties:
        from:
          type: string
        to:
          type: string
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"

    DiffHunk:
      type: object
      required: [ heading, headingOccurrence, offset, oldStart, oldLines, newStart, newLines, lines ]
      description: |
        Changed lines with 3 lines of context; changes closer than 6 lines share a hunk. The
        anchor (heading, headingOccurrence, offset) has the meaning of the feed's ranges, on
        the text after the change.
      properties:
        heading:
          type: string
          nullable: true
          description: "Nearest heading at or above the first changed line (for removals: the line above them), null if none"
        headingOccurrence:
          type: integer
          description: "Counts the headings with the same text from the top, 1 for the first"
        offset:
          type: integer
          description: "newStart minus the line of the heading, or newStart - 1 without one; negative when the context starts above the heading"
        oldStart:
          type: integer
          description: "1-based first line in the old text; with oldLines 0 the line before the hunk"
        oldLines:
          type: integer
        newStart:
          type: integer
          description: "1-based first line in the new text; with newLines 0 the line before the hunk"
        newLines:
          type: integer
        lines:
          type: array
          items:
            type: object
            required: [ op, text ]
            properties:
              op:
                type: string
                enum: [ " ", "-", "+" ]
              text:
                type: string
                description: "The line without its line break"

    HistoryAuthor:
      type: object
      required: [ name, email, username ]
      properties:
        name:
          type: string
        email:
          type: string
        username:
          type: string
          description: "Current username of the account this author resolves to (by `<username>@mkdocseditor.invalid`, including former usernames, or by the account email), empty if none"
        accountId:
          type: string
          description: "Id of that account, empty if none"
        displayName:
          type: string
          description: "The account's display name, else the git name"
        color:
          type: string
          description: "The account's color, else one derived from the git name"
        avatar:
          type: string
          nullable: true
          description: "The account's avatar hash, as in the feed; null if none"

    Error:
      type: object
      required: [ name, message ]
      properties:
        name:
          type: string
          example: "Not found"
        code:
          type: string
          description: "Machine-readable error code, see docs/auth.md section 10"
          example: "not-found"
        message:
          type: string
        details:
          type: object
          additionalProperties: true

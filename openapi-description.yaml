openapi: "3.0.3"
info:
  title: "MkDocsEditor Backend API"
  version: "2.0.0"
  description: |
    REST API of the MkDocsEditor backend. It serves the section, document and resource tree
    of an MkDocs wiki and the websocket for realtime collaborative editing.

    The websocket protocol (Automerge sync, presence, close codes) is specified in
    [docs/sync-protocol.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/sync-protocol.md).

    All paths also work without the trailing slash. Ids of sections, documents and
    resources are derived from their path, so they change when an item (or a section
    above it) is renamed or moved. Old ids keep resolving through redirects, see
    [docs/references.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/references.md)
    section 7. The root section has the id `root`.

    Accounts, sessions and the login flows are specified in
    [docs/auth.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/auth.md).
    Requests authenticate with the session cookie (web), `Authorization: Bearer mds_…`
    (Android) or an app token (`Bearer mdp_…`, or as the basic auth password).
    Every request with a method other than `GET`/`HEAD`/`OPTIONS` and without an
    `Authorization` header must send `X-Requested-With`, and an `Origin` header must be an
    allowed origin (CSRF protection). Users with the role `reader` get `403` when they try to
    change content. Error responses carry a machine-readable `code`.
  license:
    name: "AGPL-3.0-or-later"
    url: "https://www.gnu.org/licenses/agpl-3.0.html"
servers:
  - url: "http://localhost:7413/api"
    description: "Every route is served under /api"
security:
  - cookieAuth: []
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: Status
    description: "Health"
  - name: Auth
    description: "Login, links, websocket tickets and the Automerge actor map"
  - name: Account
    description: "The signed-in user's own account (sessions only)"
  - name: Admin
    description: "User administration (admin sessions only)"
  - name: MkDocs
    description: "The MkDocs project"
  - name: Sections
    description: "Folders of the docs tree"
  - name: Documents
    description: "Markdown files"
  - name: Resources
    description: "Other files (images, attachments)"
  - name: History
    description: "Revision history of documents from git (requires git.enabled)"
  - name: References
    description: "Links between items, backlinks and link paths, see docs/references.md"
  - name: Dashboard
    description: "Pinned documents and the change feed, see docs/dashboard.md"
  - name: Push
    description: "Web Push subscriptions (sessions only), see docs/push.md"
  - name: QR
    description: "QR code keys of pages, see docs/qr.md"
  - name: MCP
    description: "Model Context Protocol server for LLM agents, see docs/mcp.md"
  - name: OAuth
    description: "OAuth 2.1 authorization of MCP clients, see docs/oauth.md"

paths:
  /alive/:
    get:
      summary: "Liveness probe"
      operationId: alive
      tags: [ Status ]
      security: [ ]
      responses:
        "200":
          description: "The service is up."

  /auth/whoami/:
    get:
      summary: "The authenticated user"
      description: "With `server.auth.disabled`, this is the user `anonymous` with the role `admin`."
      operationId: whoAmI
      tags: [ Auth ]
      responses:
        "200":
          description: "The authenticated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/ws-ticket/:
    post:
      summary: "Issue a websocket ticket"
      description: |
        Returns a single-use ticket that is valid for 60 seconds. Browsers cannot set headers on
        a websocket, so they send the ticket in the `hello` message of the document websocket.
        Tickets are kept in memory only; a backend restart invalidates them.
      operationId: issueWsTicket
      tags: [ Auth ]
      responses:
        "200":
          description: "A new ticket"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forward/:
    get:
      summary: "forwardAuth check of a reverse proxy"
      description: |
        For a proxy (Traefik forwardAuth, nginx auth_request) that protects another site on the
        host of the web client, such as the MkDocs site at `/view/` (docs/auth.md section 4).
        Every account with a session or an app token passes. Without one, browsers (GET or
        HEAD with `Accept: text/html`) are sent to the login page of the web client with the
        page as `next`; everything else gets 401. `X-Forwarded-Method` and `X-Forwarded-Uri`
        count only from `server.trustedProxies`. `features` of `GET /server-info/` contains
        `forward-auth`.
      operationId: forwardAuth
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "Logged in"
          headers:
            X-Auth-User:
              description: "The username"
              schema:
                type: string
        "302":
          description: "Not logged in: `Location: https://<X-Forwarded-Host>/login?next=<path>`"
          headers:
            Location:
              schema:
                type: string
              example: "https://wiki.example.com/login?next=%2Fview%2F"
        "401":
          description: "Not logged in, and not a page request"

  /auth/status/:
    get:
      summary: "Authentication status of the server"
      description: "What a client needs before the login: setup mode, passkeys, password rules."
      operationId: authStatus
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /server-info/:
    get:
      summary: "Describe the instance for onboarding screens"
      description: "Instance name, versions, URLs and login methods. Nothing secret and nothing about accounts. A superset of /auth/status/ for onboarding."
      operationId: serverInfo
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The server info"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"

  /auth/device-link/redeem/:
    post:
      summary: "Exchange a device link token for a session"
      description: |
        Pairs a new device (the Android app) with the account that created the device link.
        The second factor counts as satisfied. The new session is not recently
        authenticated, except that it may add a passkey during its first 10 minutes.
        Unknown, used, expired and revoked tokens and a wrong username give `invalid-link`.
        Rate limited per IP.
      operationId: redeemDeviceLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLinkRedeemRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login/:
    post:
      summary: "Log in with username and password"
      description: |
        Returns a session, or a challenge when the account has a second factor. Wrong
        usernames and passwords give the same `invalid-credentials` error. Rate limited per
        IP and per account.
      operationId: login
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "A session (`status: ok`) or a second factor challenge (`status: second-factor-required`)"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/SecondFactorRequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login/second-factor/:
    post:
      summary: "Complete a login with a TOTP code or a recovery code"
      operationId: loginSecondFactor
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`invalid-second-factor` (`details.attemptsLeft`) or `challenge-expired`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reauth/:
    post:
      summary: "Confirm the identity again (step-up)"
      description: |
        Sensitive actions answer `403 reauth-required` unless the session logged in or
        confirmed its identity within the last 10 minutes. Send the password, plus a TOTP
        code when the account has TOTP (only the code for accounts without a password).
        Failures count against the login backoff of the account.
      operationId: reauth
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthRequest"
      responses:
        "200":
          description: "The end of the new step-up window"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/passkey/login/begin/:
    post:
      summary: "Start a passkey login"
      description: "Without challenge: a discoverable login (empty allowCredentials, works with conditional UI). With the challenge of a password login: the second factor."
      operationId: passkeyLoginBegin
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginBegin"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/passkey/login/finish/:
    post:
      summary: "Complete a passkey login"
      operationId: passkeyLoginFinish
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinish"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/access-requests/:
    post:
      summary: "Ask the admins for an invite"
      description: |
        Public, with a strict per-IP rate limit. The response does not depend on whether
        `documentId` or `invitedBy` exist. The token is shown only here. See
        [Access request](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/auth.md#access-request-and-join-link).
      operationId: createAccessRequest
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessRequest"
      responses:
        "201":
          description: "The request with its token (shown only now)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccessRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/access-requests/status/:
    post:
      summary: "The state of an access request"
      description: |
        Public, with a strict per-IP rate limit: poll at most every 30 seconds. An unknown
        token gives 400 `invalid-access-request`.
      operationId: accessRequestStatus
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ token ]
              properties:
                token:
                  type: string
                  description: "The `mda_…` token of the request"
      responses:
        "200":
          description: "The state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/passkey/begin/:
    post:
      summary: "Start the passkey registration of a setup, invite or reset link"
      operationId: linkPasskeyBegin
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPasskeyBegin"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/passkey/finish/:
    post:
      summary: "Register the passkey and redeem the link"
      operationId: linkPasskeyFinish
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPasskeyFinish"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reauth/passkey/begin/:
    post:
      summary: "Start a step-up with a passkey"
      operationId: reauthPasskeyBegin
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: "Options for navigator.credentials or Android Credential Manager"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/reauth/passkey/finish/:
    post:
      summary: "Complete a step-up with a passkey"
      operationId: reauthPasskeyFinish
      tags: [ Auth ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyFinish"
      responses:
        "200":
          description: "The end of the new step-up window"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"

  /.well-known/assetlinks.json:
    get:
      summary: "Digital Asset Links for the Android app"
      description: "Only with server.auth.webauthn.serveAssetLinks, see docs/auth.md section 12."
      operationId: assetLinks
      tags: [ Auth ]
      security: [ ]
      responses:
        "200":
          description: "The statement list"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/logout/:
    post:
      summary: "End the current session"
      operationId: logout
      tags: [ Auth ]
      responses:
        "204":
          description: "The session ended, the cookie is cleared"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/link/inspect/:
    post:
      summary: "Look at a setup, invite or reset link"
      operationId: inspectLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTokenRequest"
      responses:
        "200":
          description: "The pending link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkInspection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/link/redeem/:
    post:
      summary: "Redeem a link with a password"
      description: |
        Setup and invite links create an account (username, display name, password). Reset
        links set a new password and revoke all sessions of the account. The response is a
        session of the account.
      operationId: redeemLink
      tags: [ Auth ]
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRedeemRequest"
      responses:
        "200":
          description: "A session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account/:
    get:
      summary: "The signed-in user's account"
      operationId: getAccount
      tags: [ Account ]
      responses:
        "200":
          description: "The account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      summary: "Change the profile"
      description: "Changing the username needs a recent authentication (step-up). The former username stays reserved for the account."
      operationId: updateAccount
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: "The changed account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/avatar/:
    put:
      summary: "Set the profile picture"
      description: "Clients find the new version in `avatar` and load it from `/avatars/{accountId}/{avatar}/`. Connected clients get the new avatar in presence, actors and the online list."
      operationId: putAccountAvatar
      tags: [ Account ]
      requestBody:
        required: true
        description: "The image, at most 5 MB, any size and aspect ratio. The server applies the EXIF orientation, cuts out the center square, scales it to 256x256 and stores it as JPEG without metadata."
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "The changed account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: "`invalid-image`: not a readable JPEG, PNG or WebP, or over 50 megapixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: "`payload-too-large`: the image has more than 5 MB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`unsupported-media-type`: the content type is not image/jpeg, image/png or image/webp"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Remove the profile picture"
      description: "An account without one is no error."
      operationId: deleteAccountAvatar
      tags: [ Account ]
      responses:
        "200":
          description: "The changed account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/password/:
    put:
      summary: "Change the password"
      description: "Needs `currentPassword` or a recent authentication (step-up). All other sessions of the account end."
      operationId: changePassword
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: "Changed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      summary: "Remove the password (accounts with a passkey; step-up)"
      operationId: removePassword
      tags: [ Account ]
      responses:
        "204":
          description: "Removed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/totp/:
    post:
      summary: "Start the TOTP enrollment (step-up)"
      description: |
        Creates a pending secret, valid 10 minutes. Show `otpauthUri` as a QR code and
        `secret` for manual entry, then confirm with a current code.
      operationId: beginTOTP
      tags: [ Account ]
      responses:
        "200":
          description: "The pending secret"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Disable TOTP and delete the recovery codes (step-up)"
      operationId: disableTOTP
      tags: [ Account ]
      responses:
        "204":
          description: "Disabled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /account/totp/confirm/:
    post:
      summary: "Activate TOTP with a current code"
      operationId: confirmTOTP
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPConfirm"
      responses:
        "200":
          description: "TOTP is active; the recovery codes are shown only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

      summary: "Change an account"
      description: "role and status need a step-up. Admins cannot demote or disable themselves, and the last active admin stays (409 conflict). A role change closes the user's websockets with 4003; disabling ends the sessions, app tokens and reset links."
      operationId: adminUpdateUser
      tags: [ Admin ]
      requestBody:
        required: true

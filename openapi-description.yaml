      description: "A single-use mdd_ token valid for 5 minutes. connectUrl is {clientUrl}/connect#<base64url JSON payload>, see docs/auth.md. At most 5 pending links per account; a sixth revokes the oldest."
      operationId: createDeviceLink
      tags: [ Account ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLinkRequest"
      responses:
        "200":
          description: "The token, returned only now"

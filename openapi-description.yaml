  /account/tokens/:
    get:
      summary: "The app tokens of the signed-in user"
      operationId: listAppTokens
      tags: [ Account ]
      responses:
        "200":
          description: "App tokens, newest first"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      summary: "Create an app token (step-up)"
      description: "App tokens authenticate as Authorization: Bearer mdp_... (or basic auth with the username and the token). The rights are the intersection of the scope and the role; they never reach /account/ or /admin/."
      operationId: createAppToken
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTokenRequest"
      responses:
        "200":
          description: "The token, returned only now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAppToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/tokens/{tokenId}/:
    parameters:
      - $ref: "#/components/parameters/tokenId"
    patch:
      summary: "Rename an app token or OAuth grant"
      description: |
        Sessions of the owner only. Only `name` can change. The end of a token never changes:
        a body with `expiresAt` (also `null`) is `400`. To end a token early, revoke it; for a
        longer life, create a new token or authorize the OAuth client again. Writes the audit
        event `app-token.updated`.
      operationId: updateAppToken
      tags: [ Account ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppTokenUpdateRequest"
      responses:
        "200":
          description: "The renamed token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Revoke an app token"
      operationId: revokeAppToken
      tags: [ Account ]
      responses:
        "204":
          description: "Revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


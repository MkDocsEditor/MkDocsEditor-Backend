        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/users/{userId}/avatar/:
    parameters:
      - $ref: "#/components/parameters/userId"
    put:
      summary: "Set the profile picture of an account"
      operationId: adminPutAvatar
      tags: [ Admin ]
      requestBody:
        required: true
        description: "The image, at most 5 MB, any size and aspect ratio. The server applies the EXIF orientation, cuts out the center square, scales it to 256x256 and stores it as JPEG without metadata."
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "The account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: "`invalid-image`: not a readable JPEG, PNG or WebP, or over 50 megapixels"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: "`payload-too-large`: the image has more than 5 MB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "`unsupported-media-type`: the content type is not image/jpeg, image/png or image/webp"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Remove the profile picture of an account"
      description: "An account without one is no error."
      operationId: adminDeleteAvatar
      tags: [ Admin ]
      responses:
        "200":
          description: "The account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


openapi: "3.0.3"
info:
  title: "MkDocsEditor Backend API"
  version: "2.0.0"
  description: |
    REST API of the MkDocsEditor backend. It serves the section, document and resource tree
    of an MkDocs wiki and the websocket for realtime collaborative editing.

    The websocket protocol (Automerge sync, presence, close codes) is specified in
    [docs/sync-protocol.md](https://github.com/MkDocsEditor/MkDocsEditor-Backend/blob/master/docs/sync-protocol.md).

    All paths also work without the trailing slash. Ids of sections, documents and
    resources are derived from their path, so they change when an item (or a section
    above it) is renamed. The root section has the id `root`.

    Every endpoint except `GET /alive/` requires HTTP basic auth when users are configured.
    Users with the role `reader` get `403` on every method except `GET`, `HEAD` and
    `POST /auth/ws-ticket/`. Requests with the header `X-Requested-With` get no
    `WWW-Authenticate` header on a `401`.
  license:
    name: "AGPL-3.0-or-later"
    url: "https://www.gnu.org/licenses/agpl-3.0.html"
servers:
  - url: "http://localhost:7413"
security:
  - basicAuth: []
tags:
  - name: Status
    description: "Health"
  - name: Auth
    description: "Users, websocket tickets and the Automerge actor map"
  - name: MkDocs
    description: "The MkDocs project"
  - name: Sections
    description: "Folders of the docs tree"
  - name: Documents
    description: "Markdown files"
  - name: Resources
    description: "Other files (images, attachments)"
  - name: History
    description: "Revision history of documents from git (requires git.enabled)"

paths:
  /alive/:
    get:
      summary: "Liveness probe"
      operationId: alive
      tags: [ Status ]
      security: [ ]
      responses:
        "200":
          description: "The service is up."

  /auth/whoami/:
    get:
      summary: "The authenticated user"
      description: "Without configured users, this is the user `anonymous` with the role `admin`."
      operationId: whoAmI
      tags: [ Auth ]
      responses:
        "200":
          description: "The authenticated user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/ws-ticket/:
    post:
      summary: "Issue a websocket ticket"
      description: |
        Returns a single-use ticket that is valid for 60 seconds. Browsers cannot set headers on
        a websocket, so they send the ticket in the `hello` message of the document websocket.
        Tickets are kept in memory only; a backend restart invalidates them.
      operationId: issueWsTicket
      tags: [ Auth ]
      responses:
        "200":
          description: "A new ticket"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /actors/:
    get:
      summary: "The actor map"
      description: |
        Maps every Automerge actor id the backend has seen to its user. Changes made by the
        server use actors of the pseudo users `:disk` (external changes) and `:server`.
      operationId: getActors
      tags: [ Auth ]
      responses:
        "200":
          description: "All actor bindings, sorted by actor id"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events/ws/:
    get:
      summary: "Events websocket"
      description: |
        Upgrades to a websocket that pushes `tree-changed` (refetch the tree) and `online`
        (who has which document open). Authentication works like the document websocket:
        a basic auth header on the upgrade request, or a ticket in the first message
        (`{"type":"hello","ticket":"…"}`). Specified in docs/sync-protocol.md, section 6.
      operationId: eventsWebsocket
      tags: [ Auth ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /mkdocs/config/:
    get:
      summary: "The MkDocs configuration"
      description: "The content of `mkdocs.yml` as JSON."
      operationId: getMkDocsConfig
      tags: [ MkDocs ]
      responses:
        "200":
          description: "The parsed mkdocs.yml"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Error"

  /section/:
    get:
      summary: "The whole tree"
      description: "The root section with all subsections, documents and resources, recursively."
      operationId: getTree
      tags: [ Sections ]
      responses:
        "200":
          description: "The root section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: "Create a section"
      description: "Creates a folder in the parent section."
      operationId: createSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /section/{sectionId}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
    get:
      summary: "A section"
      description: "The section with its subsections, documents and resources, recursively."
      operationId: getSection
      tags: [ Sections ]
      responses:
        "200":
          description: "The section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a section"
      description: |
        Renames the folder. The ids of the section and of everything in it change. Clients
        connected to a document in it get `document-renamed` on the websocket.
      operationId: renameSection
      tags: [ Sections ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed section"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Section"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a section"
      description: |
        Deletes the folder with everything in it. While clients are connected to a document in
        it, the request fails with `409` unless `force=true` is given.
      operationId: deleteSection
      tags: [ Sections ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/:
    post:
      summary: "Create a document"
      description: "Creates an empty `<name>.md` in the parent section."
      operationId: createDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
      responses:
        "200":
          description: "The new document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's metadata"
      operationId: getDocument
      tags: [ Documents ]
      responses:
        "200":
          description: "The document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a document"
      description: |
        Renames the file to `<name>.md`. The id changes. Connected clients get
        `document-renamed` on the websocket and reconnect to the new id.
      operationId: renameDocument
      tags: [ Documents ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed document"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a document"
      description: |
        While clients are connected to the document, the request fails with `409` unless
        `force=true` is given. Connected clients then get `document-deleted`.
      operationId: deleteDocument
      tags: [ Documents ]
      parameters:
        - $ref: "#/components/parameters/force"
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /document/{documentId}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "A document's content"
      description: "The markdown text. While the document is open for editing, this is the live text."
      operationId: getDocumentContent
      tags: [ Documents ]
      responses:
        "200":
          description: "The markdown text"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/authorship/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Per-character authorship of a document"
      description: |
        Which actor (and user) inserted each character of the current text, derived from the
        Automerge history. Positions are Unicode code point offsets into the text at the
        returned heads. See docs/sync-protocol.md, section 7.
      operationId: getDocumentAuthorship
      tags: [ Documents ]
      responses:
        "200":
          description: "The authorship runs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authorship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Revision history of a document"
      description: |
        The git commits that changed the file, newest first, following renames. Requires
        `git.enabled`; without it the response is 404.
      operationId: getDocumentHistory
      tags: [ History ]
      parameters:
        - name: limit
          in: query
          required: false
          description: "Maximum number of commits (1 to 1000, default 100)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: "The commits"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/diff/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Diff between two revisions"
      description: |
        Unified diff of the document between two revisions. A revision is a commit hash (7 to
        64 hex characters) from the history, or `current` for the live text.
      operationId: getDocumentRevisionDiff
      tags: [ History ]
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: "Default: current"
          schema:
            type: string
            default: current
      responses:
        "200":
          description: "The unified diff, empty if the texts are equal"
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/content/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    get:
      summary: "A document's content at a revision"
      operationId: getDocumentRevisionContent
      tags: [ History ]
      responses:
        "200":
          description: "The markdown text at that revision"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/history/{revision}/restore/:
    parameters:
      - $ref: "#/components/parameters/documentId"
      - $ref: "#/components/parameters/revision"
    post:
      summary: "Restore a revision"
      description: |
        Changes the live text to the text at that revision. The server applies it as an
        Automerge change, so connected clients merge it like any other edit and nothing
        typed concurrently is lost. In git, the change counts for the requesting user.
        Requires the editor or admin role.
      operationId: restoreDocumentRevision
      tags: [ History ]
      responses:
        "204":
          description: "Restored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /document/{documentId}/ws/:
    parameters:
      - $ref: "#/components/parameters/documentId"
    get:
      summary: "Realtime editing websocket"
      description: |
        Upgrades to a websocket for realtime collaborative editing of the document. The
        protocol is specified in docs/sync-protocol.md. Authenticate with a basic auth header
        on the upgrade request or with a ticket (`POST /auth/ws-ticket/`) in the first
        message (`hello`). Without either, the upgrade succeeds and the connection is
        closed with code 4001 if no valid ticket arrives within 10 seconds.
      operationId: documentWebsocket
      tags: [ Documents ]
      security:
        - basicAuth: [ ]
        - { }
      responses:
        "101":
          description: "Switching protocols"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The Origin header is not in server.cors.allowedOrigins."
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's metadata"
      operationId: getResource
      tags: [ Resources ]
      responses:
        "200":
          description: "The resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: "Rename a resource"
      operationId: renameResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameRequest"
      responses:
        "200":
          description: "The renamed resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: "Delete a resource"
      operationId: deleteResource
      tags: [ Resources ]
      responses:
        "200":
          description: "Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{resourceId}/content/:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      summary: "A resource's content"
      operationId: getResourceContent
      tags: [ Resources ]
      responses:
        "200":
          description: "The file, with a content type derived from its name"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /resource/{sectionId}/{name}/:
    parameters:
      - $ref: "#/components/parameters/sectionId"
      - name: name
        in: path
        required: true
        description: "File name of the new resource"
        schema:
          type: string
    post:
      summary: "Upload a resource"
      description: "Uploads a file into the section. The content is the multipart field `file`."
      operationId: uploadResource
      tags: [ Resources ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "The new resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    sectionId:
      name: sectionId
      in: path
      required: true
      description: "Id of a section (`root` for the root section)"
      schema:
        type: string
    documentId:
      name: documentId
      in: path
      required: true
      description: "Id of a document"
      schema:
        type: string
    revision:
      name: revision
      in: path
      required: true
      description: "Commit hash from the history, 7 to 64 hex characters"
      schema:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
    resourceId:
      name: resourceId
      in: path
      required: true
      description: "Id of a resource"
      schema:
        type: string
    force:
      name: force
      in: query
      required: false
      description: "Delete even while clients are connected to an affected document"
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: "Invalid request, for example a name with a slash or a leading dot"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Missing or invalid credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "The user's role does not allow this"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "No item with this id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "The target already exists, or clients are connected to the document"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: "Unexpected error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Section:
      type: object
      required: [ type, id, name, subsections, documents, resources ]
      properties:
        type:
          type: string
          enum: [ section ]
        id:
          type: string
          example: "root"
        name:
          type: string
          description: "Folder name"
        subsections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    Document:
      type: object
      required: [ type, id, name, filesize, modtime, url ]
      properties:
        type:
          type: string
          enum: [ document ]
        id:
          type: string
          example: "5772684240079201105"
        name:
          type: string
          description: "File name without the .md extension"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time
        url:
          type: string
          description: "Path of the page relative to the site root, for example `guide/setup/`"

    Resource:
      type: object
      required: [ type, id, name, filesize, modtime ]
      properties:
        type:
          type: string
          enum: [ resource ]
        id:
          type: string
        name:
          type: string
          description: "File name"
        filesize:
          type: integer
          format: int64
        modtime:
          type: string
          format: date-time

    NewItemRequest:
      type: object
      required: [ parent, name ]
      properties:
        parent:
          type: string
          description: "Id of the parent section"
        name:
          type: string
          description: "Name of the new section, or of the document without .md"

    RenameRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          description: "New name (for documents without .md)"

    User:
      type: object
      required: [ id, username, displayName, role, color ]
      properties:
        id:
          type: string
          description: "Stable account id (`anonymous` when authentication is off)"
        username:
          type: string
          description: "Current username; it can change, the id does not"
        displayName:
          type: string
        role:
          type: string
          enum: [ admin, editor, reader ]
        color:
          type: string
          example: "#1971c2"

    Ticket:
      type: object
      required: [ ticket, expiresAt ]
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time

    Actor:
      type: object
      required: [ actorId, username, displayName, color ]
      properties:
        actorId:
          type: string
          description: "Automerge actor id, hex"
        accountId:
          type: string
          description: "Account the actor is bound to, empty for `:disk` / `:server`"
        username:
          type: string
          description: "Current username of the account, or `:disk` / `:server` for changes made by the server"
        displayName:
          type: string
        color:
          type: string

    Authorship:
      type: object
      required: [ heads, runs ]
      properties:
        heads:
          type: array
          description: "Automerge heads (hex) of the text the runs describe"
          items:
            type: string
        runs:
          type: array
          description: "Consecutive runs covering the whole text, in order"
          items:
            $ref: "#/components/schemas/AuthorshipRun"

    AuthorshipRun:
      type: object
      required: [ start, end, actorId, username ]
      properties:
        start:
          type: integer
          description: "First code point of the run"
        end:
          type: integer
          description: "Code point after the run"
        actorId:
          type: string
        accountId:
          type: string
          description: "Account of the actor, empty for server changes or if unknown"
        username:
          type: string
          description: "Current username of the account, `:disk` / `:server` for server changes, empty if unknown"

    HistoryEntry:
      type: object
      required: [ revision, time, author, coAuthors, message, path ]
      properties:
        revision:
          type: string
          description: "Commit hash"
        time:
          type: string
          format: date-time
          description: "Author time"
        author:
          $ref: "#/components/schemas/HistoryAuthor"
        coAuthors:
          type: array
          description: "From the Co-authored-by trailers"
          items:
            $ref: "#/components/schemas/HistoryAuthor"
        message:
          type: string
          description: "Commit subject"
        path:
          type: string
          description: "Path of the file in this commit, relative to the docs folder"

    HistoryAuthor:
      type: object
      required: [ name, email, username ]
      properties:
        name:
          type: string
        email:
          type: string
        username:
          type: string
          description: "Current username of the account this author resolves to (by `<username>@mkdocseditor.invalid`, including former usernames, or by the account email), empty if none"
        accountId:
          type: string
          description: "Id of that account, empty if none"

    Error:
      type: object
      required: [ name, message ]
      properties:
        name:
          type: string
          example: "Not found"
        message:
          type: string

# REST API server related configuration options
server:
  # Host and port the REST API server should listen on
  host: "0.0.0.0"
  # Port the REST API server should listen on
  # (optional) defaults to 7413
  port: 7413
  # (optional) Shown by the clients in onboarding screens (GET /server-info/). Default: the
  # host of wikiUrl, else of auth.clientUrl, else of the request.
  #instanceName: "My Wiki"
  # (optional) The published MkDocs site, reported by GET /server-info/
  #wikiUrl: "https://wiki.mycompany.com"
  # (optional) The public base URL of this API, put into the links that connect the Android
  # app. Default: derived from the request (scheme from trusted proxies, Host header).
  #backendUrl: "https://backend.wiki.mycompany.com"
  # (optional) Addresses of reverse proxies (CIDRs or single IPs) whose X-Forwarded-For and
  # X-Forwarded-Proto headers are trusted. Default: none, the TCP peer is the client.
  #trustedProxies:
  #  - "10.42.0.0/16"
  # (optional) Accounts and login, see docs/auth.md. Accounts live in <stateDir>/auth.db.
  # Without any account, the backend starts in setup mode and prints a setup link for the
  # first admin (again with: mkdocsrest setup-link). Further users join by invite links.
  auth:
    # (optional) The web client, used to build setup, invite, reset and connect links and as
    # the default passkey origin and RP ID. Without it, only the tokens are shown.
    clientUrl: "https://edit.wiki.mycompany.com"
    # (optional) Accept HTTP basic auth with account passwords (accounts without a second
    # factor). Only for the transition from the old configuration. Default: true for now.
    #legacyBasicAuth: false
    # (optional) Session lifetimes. Defaults: 720h idle, 2160h absolute
    #sessionIdleTimeout: "720h"
    #sessionMaxLifetime: "2160h"
    # (optional) Secure flag of the session cookie: auto (HTTPS, directly or through a
    # trusted proxy), always or never. Default: auto
    #cookieSecure: "auto"
    # (optional) File with the 32-byte server key (base64) that encrypts TOTP secrets. Created
    # on the first start; back it up with auth.db. The environment variable
    # MKDOCSREST_AUTH_SECRET_KEY takes precedence. Default: <stateDir>/auth.key
    #secretKeyFile: "/secrets/auth.key"
    # (optional) Login rate limits, defaults shown. disabled: true is for automated tests only.
    #rateLimits:
    #  disabled: false
    #  perIpBurst: 20
    #  perIpRefill: "6s"
    #  accountFailuresBeforeBackoff: 5
    #  maxBackoff: "15m"
    # (optional) Passkeys (WebAuthn), see docs/auth.md section 12. Without rpId and clientUrl,
    # passkeys are off.
    #webauthn:
    #  # Relying party id: the client's host or a parent domain of it. Changing it later makes
    #  # all passkeys useless. Default: host of clientUrl
    #  rpId: "wiki.mycompany.com"
    #  # Name shown by authenticators and authenticator apps. Default: MkDocsEditor
    #  rpName: "MkDocsEditor"
    #  # Allowed web origins. Default: origin of clientUrl and server.cors.allowedOrigins
    #  origins:
    #    - "https://edit.wiki.mycompany.com"
    #  # Android apps that may use the passkeys (their signing certificate fingerprints)
    #  android:
    #    - packageName: "de.markusressel.mkdocseditor"
    #      sha256CertFingerprints:
    #        - "AB:CD:EF:..."
    #  # Serve /.well-known/assetlinks.json for these apps from the backend. Default: false
    #  serveAssetLinks: false
    # (optional) Development only: no authentication, every request is the anonymous admin.
    #disabled: false
    # (optional, deprecated) Users of earlier versions. They are imported once into the
    # account database on the first start; afterwards this list is ignored and can go.
    users:
      - username: "markus"
        # bcrypt hash of the password (from mkdocsrest hash-password); it is replaced by an
        # Argon2id hash on the first login
        passwordHash: "$2a$12$replace.with.the.output.of.mkdocsrest.hash-password"
        # (optional) Name shown to other users and used as git author name, defaults to the username
        displayName: "Markus"
        # (optional) Email for git commits
        email: "markus@example.com"
        # (optional) admin, editor or reader, defaults to editor
        role: "admin"
        # (optional) Colour of the user's cursor, derived from the username by default
        color: "#e8590c"
  # (optional, deprecated) The old single-user configuration with a plain-text password.
  # Only read for the one-time import; this user becomes an admin.
  #basicAuth:
  #  user: "mkdocsrest"
  #  password: "mypassword"
  # (optional) Cross-origin resource sharing (CORS) configuration
  cors:
    # (optional) Origins of web clients. With origins listed, browsers may send credentials from
    # them, and websocket upgrades from other origins are refused. Without, every origin is
    # allowed but browsers send no credentials cross-origin.
    allowedOrigins:
      - "https://wiki.mycompany.com"
    # (optional) List of allowed methods
    allowedMethods:
      - HEAD
      - GET
      - PUT
      - POST
      - DELETE

# MkDocs related configuration options
mkdocs:
  # Path to the root of the mkdocs project
  projectPath: "/home/markus/documents/Wiki"
  # (optional) Path to the mkdocs.yml file
  # defaults to "<projectPath>/mkdocs.yml"
  configFile: "/home/markus/documents/Wiki/mkdocs.yml"
  # (optional) Path to the directory containing the documents
  # defaults to "<projectPath>/docs"
  docsPath: "/home/markus/documents/Wiki/docs"
  # (optional) Folder for the realtime editing state (Automerge documents, actor ids).
  # Must be writable and outside docsPath. Never delete it while clients may hold offline edits.
  # defaults to "<projectPath>/.mkdocseditor" (added to .git/info/exclude automatically)
  stateDir: "/home/markus/documents/Wiki/.mkdocseditor"
  # (optional) List of files and directories to exclude from the document tree
  blacklist:
    - "stylesheets"

# (optional) Commit the changes made through the backend to git, see docs/sync-protocol.md section 10.
# The docs folder must be inside a git repository. Only files the backend changed are committed.
git:
  enabled: false
  # commit a document when all users have left it for this many minutes (default: 5)
  commitAfterLeave: 5
  # commit a document after this many minutes without a change, even while users are connected (default: 10)
  commitAfterIdle: 10
  # commit at least every this many minutes during continuous editing (default: 60)
  commitMaxInterval: 60
  # the committer; the author is the user who made the most changes (default: MkDocsEditor)
  committerName: "MkDocsEditor"
  committerEmail: "mkdocseditor@mkdocseditor.invalid"
  # run "git push" after each commit (default: false). Credentials come from the environment
  # (GIT_SSH_COMMAND, a credential helper), never from this file.
  push: false
  #remote: "origin"
  #branch: "master"

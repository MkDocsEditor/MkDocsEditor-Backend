version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  settings:
    gosec:
      excludes:
        # file paths come from the tree of the configured docs folder
        - G304
        # wiki files are meant to be readable by the MkDocs server
        - G301
        - G302
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt

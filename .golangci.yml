version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - unconvert
  settings:
    gosec:
      excludes:
        # file paths come from the tree of the configured docs folder
        - G304
        # wiki files are meant to be readable by the MkDocs server
        - G301
        - G302
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # The websocket handlers receive the upgrade request, so gosec treats everything that
      # happens on a connection as tainted by it. The request only selects a document: paths
      # come from the item tree and the state store, as for G304.
      - path: internal/collab/
        linters:
          - gosec
        text: "G70[36]"

formatters:
  enable:
    - gofmt

name: Go

on:
  push:
    branches: [ master ]
    tags:
      - '*.*.*'
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the minimum version from go.mod and the latest stable release
        go: [ go.mod, stable ]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Go (go.mod)
        id: go-mod
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Go (stable)
        id: go-stable
        if: matrix.go == 'stable'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # Not the setup-go cache: its key is shared with the other jobs and whichever finishes first
      # saves it, so it rarely holds the -race objects this job compiles. Pull requests only restore
      # it: a cache per pull request would take about 1 GB of the 10 GB the repository gets.
      - name: Restore the Go modules and the race build
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-mod.outputs.go-version || steps.go-stable.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-mod.outputs.go-version || steps.go-stable.outputs.go-version }}-

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Save the Go modules and the race build
        if: github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Saved by the build job on master
      - name: Restore the Go modules and the build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-amd64-${{ steps.go.outputs.go-version }}-

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          skip-save-cache: ${{ github.event_name == 'pull_request' }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # the latest stable release, like the Docker image, so the standard library is current
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # Saved by the test job on master
      - name: Restore the Go modules and the build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint openapi-description.yaml
        run: npx -y @redocly/cli@2.72.1 lint openapi-description.yaml

  interop:
    name: Interop (JS Automerge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Saved by the build job on master
      - name: Restore the Go modules and the build
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-amd64-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-amd64-${{ steps.go.outputs.go-version }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interop/package-lock.json

      - name: Install @automerge/automerge
        working-directory: interop
        run: npm ci

      - name: Run the interop test against the backend
        run: ./interop/run.sh

  build:
    name: Build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # automerge-go links a Rust static library through cgo, so each binary is built natively.
        # The binaries link glibc dynamically, so both runners stay on the same Ubuntu release:
        # it sets the oldest glibc the released binaries run on.
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Not the setup-go cache: its key is shared with the other jobs and whichever finishes first
      # saves it, so it never holds the -trimpath objects this job compiles. Pull requests only
      # restore it, see the test job.
      - name: Restore the Go modules and the release build
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-${{ matrix.arch }}-${{ steps.go.outputs.go-version }}-

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="dev"; fi
          LDFLAGS="-w -s -X github.com/MkDocsEditor/MkDocsEditor-Backend/cmd/global.Version=${VERSION} -X github.com/MkDocsEditor/MkDocsEditor-Backend/cmd/global.Commit=${GITHUB_SHA::7} -X github.com/MkDocsEditor/MkDocsEditor-Backend/cmd/global.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BINARY="./dist/mkdocs-backend-linux-${ARCH}"
          CGO_ENABLED=1 GOOS=linux GOARCH="${ARCH}" go build -trimpath -ldflags "${LDFLAGS}" -o "${BINARY}" .
          file "${BINARY}"
          ldd --version | head -1
          echo "newest glibc symbol: $(objdump -T "${BINARY}" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          "${BINARY}" --version


      - name: Save the Go modules and the release build
        if: github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: mkdocs-backend-linux-${{ matrix.arch }}
          path: dist/mkdocs-backend-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  # A required status check. A job skipped because of a failed need counts as passed, so this one
  # always runs and fails by itself, otherwise a failed build would not block the merge.
  generate:
    name: Generate cross-platform builds
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [ test, lint, interop, build ]
    permissions:
      contents: write
    steps:
      - name: Check that the tests and the builds passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "${RESULTS}"
          for result in ${RESULTS}; do
            [ "${result}" = "success" ]
          done

      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: mkdocs-backend-linux-*
          path: dist
          merge-multiple: true

      - name: Show the binaries
        run: file dist/mkdocs-backend-linux-amd64 dist/mkdocs-backend-linux-arm64

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/mkdocs-backend-linux-amd64
            dist/mkdocs-backend-linux-arm64
